[pytest]
# --strict-markers turns a typo'd or undeclared marker into an error rather than a
# silently-ignored warning. Verified safe: every marker currently used in tests/ is
# either a pytest builtin or declared below.
addopts = -v --tb=short --strict-markers
# Every module's own tests run too: app/modules/<module>/tests/ is outside
# tests/, and a bare `pytest` (what CI runs) only collects testpaths. The
# shared fixtures reach them through app/modules/conftest.py.
testpaths = tests app/modules/*/tests
# Put the repo root on sys.path so `import app` works under a bare `pytest`
# invocation in CI (not just `python -m pytest`, which adds the cwd itself).
pythonpath = .
# asyncio_mode was `auto`, which activates pytest-asyncio's collection hook on
# every collector. There are no async tests in this repository - the sole
# `async def` is a monkeypatch stub inside a sync test - so the plugin bought
# nothing and cost the whole suite: on pytest 9 (which requirements-test.txt
# pins for a CVE) pytest-asyncio 0.x raises
#     INTERNALERROR AttributeError: 'Package' object has no attribute 'obj'
# from pytest_collectstart, aborting COLLECTION. Not one test ran in CI.
# It bites Package collectors specifically, i.e. tests/journeys/ and
# tests/smoke/, which have __init__.py.
# To reintroduce async tests: add pytest-asyncio>=1.0 and restore this line.
base_url = http://127.0.0.1

markers =
    # --- Active: markers with tests in this repository -------------------------
    smoke: Smoke tests for critical paths
    journey: End-to-end journey tests — one per user persona, CI-enforced gate
    ai_protocol: Enabled AI browser flows using an explicit local protocol stub; not live model qualification
    guide_history: Providerless saved-guide history browser flows with explicit guide policy enabled
    census: A runtime inventory of every screen — what is on it and
        whether any of it works. Unlike every other gate here it is not
        derived from a defect that already happened, so it can find a
        first instance. Heavy; run with: pytest -m census
    adversarial: Deterministic re-runs of the adversarial sweep's findings.
        Runs separately after ordinary smoke in release CI; traverses the
        url_map repeatedly against isolated test data. Run with: pytest -m adversarial
    quarantine: Flaky tests excluded from blocking shards and run in a
        non-blocking quarantine job; the quarantine list in
        tests/quarantine.json controls which tests carry this marker.

    # --- Reserved: no tests in this repository yet -----------------------------
    # These describe suites that live in the upstream private repository and were
    # not carried into this open-source extract. They are kept declared (rather
    # than deleted) so a ported suite works without touching this file, and are
    # segregated (rather than listed as active) so the taxonomy does not advertise
    # coverage that does not exist here.
    #
    # `journey` was listed here as selecting nothing. That stopped being true when
    # tests/smoke/test_archetype_journeys.py and test_accessibility_audit.py were
    # added - both carry pytest.mark.journey - so it has moved to Active above.
    # Verify with: pytest -m journey --collect-only -q
    e2e: End-to-end browser tests (requires Playwright + tests/e2e/)
    journey_deploy: Deploy pipeline tests requiring live Docker/cloud infra
    regression: Regression tests
    performance: Performance/timing tests
    slow: Tests that take longer than 30 seconds
    arch_quality: Golden architecture quality tests — reference cases, CI variance
    flow: Cross-journey flow tests spanning multiple pages and personas
    sidebar_load: Tier-1 sidebar health — every page loads without 500
    sidebar_north_star: Tier-2 sidebar health — meaningful content per domain
    sidebar_sweep: Tier-3 sidebar health — full single-pass diagnostic sweep
