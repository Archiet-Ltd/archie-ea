name: TEMP visual baseline capture

# Temporary, one-off helper for this PR only. Captures tests/smoke/visual_baselines/
# PNGs using the SAME Chromium build CI itself installs, so the result is pixel-correct
# against real CI rendering (unlike a locally-captured baseline, which can mismatch when
# the local sandbox's Chromium build differs from the one `playwright install` fetches in
# CI). Dispatch manually, download the uploaded artifact, commit the PNGs, then delete
# this file -- it is not part of the permanent gate set and intentionally does not run
# on push or pull_request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture visual baselines
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_visual_capture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,size=2g
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_visual_capture
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_visual_capture
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret-0123456789abcdef
      SMOKE_BOOT_TIMEOUT: "300"
      SMOKE_PAGE_TIMEOUT: "45000"
      SMOKE_BROWSER: chromium
      SMOKE_REQUIRE_BROWSER: "1"
      SMOKE_VISUAL_UPDATE_BASELINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-timeout
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Create schema
        run: |
          python -m flask --app manage init-db
          python -m flask --app manage schema-upgrade
          python -m flask --app manage reconcile-schema
      - name: Capture baselines (writes tests/smoke/visual_baselines/*.png)
        run: pytest tests/smoke/test_visual_regression.py -q -p no:randomly --timeout=900 -W ignore::DeprecationWarning
      - name: Upload captured baselines
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-baselines-${{ github.sha }}
          path: tests/smoke/visual_baselines/
          if-no-files-found: error
          retention-days: 7
