name: Whole-product active defect audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.persona }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        persona:
          - solution_architect
          - enterprise_architect
          - business_architect
          - arb_member
          - portfolio_manager
          - cto
          - procurement
          - application_manager
          - platform_admin
          - security_architect
          - data_architect
          - finance
          - compliance
          - risk
          - operations
          - non_technical_owner
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_whole_product
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_whole_product
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_whole_product
      FLASK_CONFIG: testing
      SECRET_KEY: whole-product-ci-only-0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and browser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Create the isolated audit schema
        run: |
          python -m flask --app manage init-db
          python -m flask --app manage schema-upgrade
          python -m flask --app manage reconcile-schema
      - name: Exercise every registered surface as ${{ matrix.persona }}
        run: >-
          python scripts/production_readiness_audit.py
          --persona ${{ matrix.persona }}
          --report whole-product-audit-${{ matrix.persona }}.json
      - name: Retain the complete per-role evidence even when defects fail the audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-${{ matrix.persona }}-${{ github.sha }}
          path: |
            whole-product-audit-${{ matrix.persona }}.json
            audit-server.log
          if-no-files-found: warn
          retention-days: 30
