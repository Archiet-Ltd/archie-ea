name: CI

# Gates for a public AGPL repo. Every job here is a HARD gate — nothing is
# advisory, and nothing is allowed to pass by being skipped.
#
# The previous version of this file had a `lint` job with BOTH
# `continue-on-error: true` AND `ruff check . || true`, i.e. doubly neutered: it
# could not fail. It has been replaced by the ratcheted static-gates job below,
# which fails when a measurement gets worse than the recorded baseline. See
# docs/adr/0001-verification-strategy.md for why ratchets rather than a big-bang
# clean-up.
on:
  push:
    # main/master AND the branch production actually deploys from. That branch
    # was previously ungated: it is not the default branch, so `push` never fired
    # for it, and deploys are cut straight from it rather than through a PR — so
    # every release went out with no CI having run on the exact tree being
    # shipped. It is not hypothetical: `fix(csp)` and its gate sat on a feature
    # branch while production served the broken code they fixed, and the smoke
    # suite that would have caught it (a console-error assertion per archetype,
    # already present) never executed against a deployed commit.
    branches: [main, master, trial/merge-upstream]
  # Deliberately NO branch filter. The previous `branches: [main, master]` gated
  # only PRs targeting the default branch, so work on a long-lived integration
  # branch accumulated commits with no gate having run on any of them and the
  # first real signal arrived at the merge to main - the most expensive possible
  # moment to learn a ratchet has regressed.
  pull_request:
  # Run the full suite against a work-in-progress branch without opening a PR.
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Unexpected passes must be resolved, not silently accepted as release proof.
  PYTEST_ADDOPTS: "-o xfail_strict=true"
  # Pinned deliberately. The ratchet baselines in verification_baseline.json are a
  # measurement made with a specific Ruff version; a floating install can report more
  # findings for the same code and fail the ratchet for a reason unrelated to the
  # change under review. Bump this and re-run `scripts/verify.py --update-baseline`
  # in the same commit. Keep in step with .pre-commit-config.yaml.
  RUFF_VERSION: "0.16.0"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history so the scan covers every commit
      # Runs the gitleaks CLI directly instead of gitleaks/gitleaks-action@v2.
      # The action refuses to run on a GitHub *organisation* without a paid
      # licence ("[<company-org>] is an organization. License key is
      # required."), and before that it aborted on a missing GITHUB_TOKEN. Every
      # CI run had been red since mid-June for those reasons alone - never
      # because a secret was found - which made real failures indistinguishable
      # from the false alarm. The scanner itself is free and open source; only
      # the convenience wrapper is licensed.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest             detect --source=/repo --redact --verbose --no-banner --exit-code 1
        # --verbose is deliberate: without it gitleaks prints only "leaks found: N"
        # and names nothing, which is unactionable. --redact keeps the secret values
        # themselves out of the build log.


  static-gates:
    name: Static gates (compile + ratchets)
    runs-on: ubuntu-latest
    # The static tag includes route/navigation and CSRF coverage, which import
    # the real app, plus the reproducible CSS build. Install the application
    # dependencies and the exact standalone Tailwind binary those gates need;
    # a minimal lint-only environment turns missing dependencies into false
    # failures and silently skips CSS verification.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install gate tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==${RUFF_VERSION}" pip-audit
          mkdir -p scripts/bin
          curl --fail --location --retry 3 \
            --output scripts/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x scripts/bin/tailwindcss
      - name: Install Chromium for JavaScript syntax validation
        run: python -m playwright install --with-deps chromium
      - name: Compile + lint ratchets + design tokens + air-gap
        run: python scripts/verify.py --tag static
      - name: Dependency CVE gate
        # Run the scan an enterprise security review would run, before they do.
        run: python scripts/verify.py --gate dependency-cves

  boot-health:
    name: Boot health (no database)
    runs-on: ubuntu-latest
    # Catches the class of failure nothing else here can see: a blueprint that
    # silently fails to register, or a url_for() endpoint that no longer resolves
    # (a BuildError 500 on every page rendering the sidebar).
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot + wiring gate
        env:
          FLASK_CONFIG: testing
          SECRET_KEY: ci-only-not-secret
        run: python scripts/verify.py --gate boot-health
      # broken-surfaces belongs here for the same reason boot-health does: it
      # resolves every href and fetch() against the app's REAL url_map, so it
      # has to boot the app. It was tagged `static` when introduced and crashed
      # on every run in that job, which installs no application dependencies.
      - name: Front-end targets resolve to real routes
        env:
          FLASK_CONFIG: testing
          SECRET_KEY: ci-only-not-secret
        run: python scripts/verify.py --gate broken-surfaces
      # deployed-deps belongs here, not in static-gates: it compares
      # requirements.txt against what is importable, so it needs the
      # dependencies this job installs.
      - name: Deployed dependency floors
        run: python scripts/verify.py --gate deployed-deps
      - name: Real requests survive worker recycling
        run: python scripts/qa/check_worker_recycling.py

  tests:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # TestingConfig reads TEST_DATABASE_URL — not DATABASE_URL. The previous
      # workflow set only DATABASE_URL and passed by coincidence, because the
      # TestingConfig fallback happened to match this service's host/port/dbname.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      # create_app() selects config from FLASK_CONFIG. FLASK_ENV (set here before)
      # has no effect on config selection.
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      # tests/csp/test_csp_evaluator.py is part of this job and contains four
      # real-browser assertions. Without the binary pytest reports four skips,
      # which is not valid release evidence.
      - name: Install browsers for rendered UI regression tests
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Create schema
        run: |
          python -c "import psycopg2" 2>/dev/null || pip install psycopg2-binary
          flask --app manage init-db
          flask --app manage reconcile-schema
      # The schema deploy applies this migration after reconcile-schema in every
      # environment. Without the unique provenance index the write-time projection
      # into unified_capabilities is skipped by design, so the tests that exercise
      # that projection would fail or skip here on a schema production never has.
      - name: Apply the capability provenance migration
        run: flask --app manage apply-unified-capability-provenance-migration
      - name: Run non-smoke tests with coverage and route verification
        # route_verification.json is ignored execution evidence. Delete any
        # stale copy, create it from this job's non-smoke pytest run, then
        # enforce it immediately. This job includes rendered UI regressions;
        # the separate smoke jobs own full-app browser journeys.
        # --maxfail keeps the log readable while still surfacing many failures.
        run: |
          rm -f route_verification.json
          pytest -q --maxfail=20 --ignore=tests/smoke \
            --cov=app --cov-report=term-missing:skip-covered --cov-report=xml \
            -o xfail_strict=true --junitxml=backend-tests.xml \
            -p scripts.route_verification_audit
          python scripts/verify.py --gate nav-verified
      - name: Require executed backend tests without skips
        if: always()
        run: python scripts/ci/check_junit_qualification.py backend-tests.xml
      - name: Coverage summary
        # Published, not gated. Establishing the number is step one; a
        # do-not-decrease gate follows once a baseline exists on main.
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("coverage.xml").getroot()
          except (OSError, ET.ParseError):
              print("no coverage.xml produced")
              raise SystemExit(0)
          rate = float(root.get("line-rate", 0)) * 100
          covered = root.get("lines-covered", "?")
          valid = root.get("lines-valid", "?")
          print(f"line coverage: {rate:.2f}%  ({covered}/{valid} statements)")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-xml
          path: |
            coverage.xml
            backend-tests.xml
          if-no-files-found: ignore

  # main grew a parallel `verify` job that ran --tag static / boot-health /
  # schema-drift with --require-db. Its coverage is already provided here by the
  # static-gates, boot-health and db-gates jobs against the 18-gate runner, so it
  # is not carried over. main's `lint` job is likewise dropped - it carried both
  # continue-on-error and `|| true`, so it could not fail.
  db-gates:
    name: Database gates (schema drift)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/archie_test
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create schema
        run: |
          flask --app manage init-db
          flask --app manage reconcile-schema
      - name: Generate SBOM (CycloneDX)
        # From the INSTALLED environment, not requirements.txt: the latter pins
        # ranges, so a requirements-derived SBOM has no resolved versions and no
        # licence data — useless for a security review.
        run: |
          pip install cyclonedx-bom
          python -m cyclonedx_py environment -o sbom.cyclonedx.json
          python - <<'PY'
          import json
          d = json.load(open("sbom.cyclonedx.json", encoding="utf-8"))
          c = d.get("components", [])
          print(f"SBOM: {len(c)} components, spec {d.get('specVersion')}")
          print(f"  with version: {sum(1 for x in c if x.get('version'))}")
          print(f"  with licence: {sum(1 for x in c if x.get('licenses'))}")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: warn
      - name: Schema drift gate
        # --require-db turns a missing database into a FAILURE rather than a skip,
        # so this gate cannot silently pass by not running.
        run: python scripts/verify.py --gate schema-drift --require-db

  # The doubly-neutered `lint` job (continue-on-error: true AND `ruff check . ||
  # true`) that the header comment above says was replaced had in fact survived
  # the replacement and was still running here. It could not fail under any
  # circumstance, so it contributed a permanently-green check that read as
  # coverage while asserting nothing. Removed rather than repaired: the ratcheted
  # `lint-core` / `undefined-names` / `redefinitions` gates inside the
  # `static-gates` job are the real enforcement, and they are hard gates.
  # Advisory full-tree lint remains available locally as `ruff check .`.

  security-sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit
      # Ratchet, not a big bang. .bandit-baseline.json records the MEDIUM+HIGH
      # findings that existed on 2026-07-30, so this job fails only on NEW ones.
      # That stops the bleeding immediately without blocking every change behind
      # a large cleanup. Regenerate the baseline ONLY when deliberately accepting
      # a finding, and say why in the commit message.
      # Not `bandit -b baseline.json`: its matching keys on file path AND line
      # number, so a Windows-generated baseline never matches the Linux runner's
      # "./app/..." paths, and any edit above a finding shifts its line and trips
      # "-- Candidate Issues --". This gate fingerprints on
      # (test_id, normalised path, source line) instead.
      - name: bandit (fail on new findings only)
        run: python scripts/ci/bandit_gate.py

  smoke:
    name: Browser journeys (one per archetype)
    runs-on: ubuntu-latest
    # Renders real pages in a real browser against a real database. Every cheaper
    # layer has passed defects this catches: a front end blocked by integrity
    # hashes, handlers that 500 on their first row, and pages returning 200 while
    # rendering blank values.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_smoke
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_smoke
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret-0123456789abcdef
      SMOKE_BOOT_TIMEOUT: "300"
      SMOKE_PAGE_TIMEOUT: "45000"
      SMOKE_BROWSER: chromium
      SMOKE_REQUIRE_BROWSER: "1"
      SMOKE_SCREENSHOT_DIR: tests/smoke/_shots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-timeout
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Create schema
        id: smoke-schema
        run: |
          python -m flask --app manage init-db
          python -m flask --app manage reconcile-schema
      - name: Run archetype journeys
        run: pytest tests/smoke -q -p no:randomly --timeout=900 -W ignore::DeprecationWarning -m "not adversarial and not census and not ai_protocol and not guide_history" --junitxml=tests/smoke/_artifacts/chromium-main.xml
      - name: Interaction-reality census (dead controls, junk modals, silent forms)
        if: ${{ !cancelled() && steps.smoke-schema.outcome == 'success' }}
        run: pytest tests/smoke/test_interaction_reality.py -q -p no:randomly -m census --timeout=1200 -W ignore::DeprecationWarning --junitxml=tests/smoke/_artifacts/chromium-census.xml
      - name: Adversarial regression probes (isolated test database)
        if: ${{ !cancelled() && steps.smoke-schema.outcome == 'success' }}
        env:
          SMOKE_AI_PROTOCOL_STUB: "1"
        run: pytest tests/smoke/test_adversarial_probes.py -q -p no:randomly -m adversarial --timeout=3600 -W ignore::DeprecationWarning --junitxml=tests/smoke/_artifacts/chromium-adversarial.xml
      - name: Enabled AI protocol and persistence journeys (local provider only)
        if: ${{ !cancelled() && steps.smoke-schema.outcome == 'success' }}
        env:
          SMOKE_AI_PROTOCOL_STUB: "1"
        run: pytest tests/smoke/test_ai_protocol_journeys.py -q -p no:randomly -m ai_protocol --timeout=900 -W ignore::DeprecationWarning --junitxml=tests/smoke/_artifacts/chromium-ai-protocol.xml
      - name: Providerless saved-guide history journeys
        if: ${{ !cancelled() && steps.smoke-schema.outcome == 'success' }}
        env:
          AI_PAGE_GUIDE_ENABLED: "true"
          SMOKE_AI_PROTOCOL_STUB: ""
        run: pytest tests/smoke/test_page_guide_history_journey.py -q -p no:randomly -m guide_history --timeout=900 -W ignore::DeprecationWarning --junitxml=tests/smoke/_artifacts/chromium-guide-history.xml
      - name: Require all browser reports without skips
        if: always()
        run: >-
          python scripts/ci/check_junit_qualification.py
          tests/smoke/_artifacts/chromium-main.xml
          tests/smoke/_artifacts/chromium-census.xml
          tests/smoke/_artifacts/chromium-adversarial.xml
          tests/smoke/_artifacts/chromium-ai-protocol.xml
          tests/smoke/_artifacts/chromium-guide-history.xml
      - name: Upload browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-chromium-${{ github.sha }}
          path: |
            tests/smoke/_shots/
            tests/smoke/_artifacts/
            /tmp/smoke-server-*.log
          if-no-files-found: ignore
          retention-days: 30

  browser-compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_browser_compat
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_browser_compat
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_browser_compat
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret-0123456789abcdef
      SMOKE_BOOT_TIMEOUT: "300"
      SMOKE_PAGE_TIMEOUT: "45000"
      SMOKE_BROWSER: ${{ matrix.browser }}
      SMOKE_REQUIRE_BROWSER: "1"
      SMOKE_SCREENSHOT_DIR: tests/smoke/_shots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-timeout
      - name: Install ${{ matrix.browser }}
        run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Create schema
        id: compatibility-schema
        run: |
          python -m flask --app manage init-db
          python -m flask --app manage reconcile-schema
      - name: Run cross-browser critical journeys
        run: >-
          pytest -q -p no:randomly --timeout=900 -W ignore::DeprecationWarning
          tests/smoke/test_accessibility_audit.py
          tests/smoke/test_archetype_journeys.py
          tests/smoke/test_authorisation_matrix.py
          tests/smoke/test_roadmap_crud_journey.py
          tests/smoke/test_transformation_room_journeys.py
          tests/smoke/test_blueprint_composition_controls.py
          tests/smoke/test_blueprint_governance_controls.py
          tests/smoke/test_vendor_dialog_controls.py
          tests/smoke/test_data_entity_lifecycle.py
          tests/smoke/test_manual_application_import.py
          tests/smoke/test_application_import_history_journey.py
          tests/smoke/test_brand_home_navigation.py
          tests/smoke/test_model_viewer_navigation.py
          --junitxml=tests/smoke/_artifacts/${{ matrix.browser }}.xml
      - name: Cross-browser AI submission and persistence
        if: ${{ !cancelled() && steps.compatibility-schema.outcome == 'success' }}
        env:
          SMOKE_AI_PROTOCOL_STUB: "1"
        run: pytest tests/smoke/test_ai_protocol_journeys.py -q -p no:randomly -m ai_protocol --timeout=900 -W ignore::DeprecationWarning --junitxml=tests/smoke/_artifacts/${{ matrix.browser }}-ai-protocol.xml
      - name: Cross-browser providerless saved history
        if: ${{ !cancelled() && steps.compatibility-schema.outcome == 'success' }}
        env:
          AI_PAGE_GUIDE_ENABLED: "true"
          SMOKE_AI_PROTOCOL_STUB: ""
        run: pytest tests/smoke/test_page_guide_history_journey.py -q -p no:randomly -m guide_history --timeout=900 -W ignore::DeprecationWarning --junitxml=tests/smoke/_artifacts/${{ matrix.browser }}-guide-history.xml
      - name: Require executed compatibility tests without skips
        if: always()
        run: >-
          python scripts/ci/check_junit_qualification.py
          tests/smoke/_artifacts/${{ matrix.browser }}.xml
          tests/smoke/_artifacts/${{ matrix.browser }}-ai-protocol.xml
          tests/smoke/_artifacts/${{ matrix.browser }}-guide-history.xml
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ matrix.browser }}-${{ github.sha }}
          path: |
            tests/smoke/_shots/
            tests/smoke/_artifacts/
            /tmp/smoke-server-*.log
          if-no-files-found: ignore
          retention-days: 30

  walkthrough:
    name: Level 10 archetype walkthrough
    runs-on: ubuntu-latest
    # docs/TESTING_STANDARD.md level 10: not "does it break?" but "can this
    # archetype do their job, and could they have FOUND the page?". It runs as a
    # non-admin per persona, measures geometry at a fixed viewport rather than
    # photographing it, and fails on any console error.
    #
    # It exists as a CI job rather than a verify.py gate because it needs a live
    # server and a seeded tenant. On its first run every static gate was green
    # and it still found that the CTO had no link to the technology radar they
    # are authorised to set -- no gate in levels 0-9 asks that question.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archie_walkthrough
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_walkthrough
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/archie_walkthrough
      FLASK_CONFIG: testing
      SECRET_KEY: ci-only-not-secret-0123456789abcdef
      WALKTHROUGH_BASE_URL: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Create schema and seed the tenant
        run: |
          python -m flask --app manage init-db
          python -m flask --app manage reconcile-schema
          python scripts/seed_walkthrough_users.py
      - name: Start the app
        run: |
          nohup python -m flask --app manage run --no-reload --port 5001 > /tmp/walkthrough-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5001/account/login && break
            sleep 5
          done
      - name: Walk every archetype
        run: python scripts/walkthrough_archetypes.py
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: walkthrough-report
          path: |
            walkthrough_report.json
            /tmp/walkthrough-server.log
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency CVEs (pip-audit)
    runs-on: ubuntu-latest
    # A ratchet against scripts/ci/dependency_baseline.json: the count may fall,
    # never rise. The baseline is accepted risk, not proof of safety - every entry
    # is a real advisory a security review will ask about.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: python scripts/ci/dependency_audit.py

  release-image:
    name: Build immutable release image
    if: github.event_name != 'pull_request'
    needs:
      - secret-scan
      - static-gates
      - boot-health
      - tests
      - db-gates
      - security-sast
      - smoke
      - browser-compatibility
      - walkthrough
      - dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Prove production Compose cannot rebuild or shadow application code
        shell: bash
        run: |
          export ARCHIE_IMAGE="ghcr.io/example/archie@sha256:$(printf '0%.0s' {1..64})"
          export SECRET_KEY="release-compose-contract-only"
          docker compose -f docker-compose.yml -f deploy/docker-compose.production.yml --profile email config --format json > /tmp/production-compose.json
          python - <<'PY'
          import json, os

          config = json.load(open("/tmp/production-compose.json", encoding="utf-8"))
          roles = {"database-bootstrap", "schema-deploy", "database-acl", "server", "worker"}
          inherited_environment = {
              "database-bootstrap": "DATABASE_ADMIN_URL",
              "schema-deploy": "DATABASE_URL",
              "database-acl": "DATABASE_ADMIN_URL",
              "server": "DATABASE_URL",
              "worker": "DATABASE_URL",
          }
          images = set()
          for role in roles:
              service = config["services"][role]
              assert "build" not in service, (role, service.get("build"))
              assert not any(
                  volume.get("target") == "/app"
                  for volume in service.get("volumes", [])
                  if isinstance(volume, dict)
              ), role
              assert service["environment"]["FLASK_CONFIG"] == "production", role
              assert service["environment"]["SECRET_KEY"] == os.environ["SECRET_KEY"], role
              assert inherited_environment[role] in service["environment"], role
              images.add(service["image"])
          assert images == {config["services"]["server"]["image"]}
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image identity
        id: meta
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/archie" >> "$GITHUB_OUTPUT"
      - name: Build and push exactly once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          provenance: mode=max
          sbom: true
      - name: Verify registry digest and write release manifest
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$DIGEST")" = "$REVISION"
          docker run --rm --entrypoint python "$IMAGE@$DIGEST" -c "import app, flask; print('release image imports cleanly')"
          python - <<'PY'
          import json, os
          from pathlib import Path

          image = os.environ["IMAGE"]
          digest = os.environ["DIGEST"]
          revision = os.environ["REVISION"]
          Path("release.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "commit": revision,
                      "digest": digest,
                      "image": f"{image}@{digest}",
                      "workflow_run": os.environ["GITHUB_RUN_ID"],
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.sha }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
