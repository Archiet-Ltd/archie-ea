name: Restore drill

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      restore_target_time:
        description: ISO-8601 target time for the wal-g restore drill
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  restore-drill:
    name: Restore drill (wal-g scratch restore)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run restore drill and print timing
        env:
          WALG_STORAGE_PREFIX: ${{ secrets.RESTORE_DRILL_WALG_STORAGE_PREFIX }}
          WALG_S3_PREFIX: ${{ secrets.RESTORE_DRILL_WALG_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RESTORE_DRILL_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RESTORE_DRILL_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.RESTORE_DRILL_AWS_REGION }}
          RESTORE_TARGET_TIME: ${{ inputs.restore_target_time || '' }}
        run: |
          if [ -z "$RESTORE_TARGET_TIME" ]; then
            export RESTORE_TARGET_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          bash scripts/restore_drill.sh
