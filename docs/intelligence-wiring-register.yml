not_intelligence:
- id: IW-50
  fact: Duplicate maturity columns outside the authority
  where:
  - business_capabilities.py:80-84
  - capabilities.py:125-127 and 250
  - capability_gap_analysis.py:218-223
  - capability_models.py:422-424
  - solution_models.py:86-87 and 1086-1087
  - framework_configuration.py:257
  - industry_apqc.py:233
  - manufacturing_capability.py:156-161 and 371
  - process_data.py:114
  - apqc_process.py:48
  - capability_to_vendor_mapping.py:88 and 192
  reason: The authority is unified_capabilities (ADR-005-v2, RG-5b); section 3 forbids any lens reading these; several carry defaults (1 or 3) that would fabricate a level.
- id: IW-51
  fact: Capability gap detail rows with defaulted levels and priority scores
  where:
  - capability_gap_analysis.py CapabilityGapDetail (current_maturity default 1
  - required_maturity_level default 3
  - four impact scores default 3)
  reason: Defaults stand in for measurements; makes the helper's under_target the one maturity gap; AIGapDetectionService's import of this class is marked dead-code-ok. Retire or repoint is a separate decision.
- id: IW-52
  fact: Text owner columns
  where:
  - ApplicationComponent.application_owner
  - business_owner
  - technical_owner; UnifiedCapability.business_owner
  - capability_owner
  - it_owner; BusinessDomain.domain_owner; VendorContract.contract_owner; Gap.owner
  reason: The ownership register entry forbids reading a text column as the owner; the A-12 reader is the only owner read. Risk.owner stays on the L6 row as the recorded mitigation owner text, never resolved to a person.
- id: IW-53
  fact: Legacy JSON dependency lists
  where:
  - capabilities.py depends_on
  - models.py upstream_dependencies and downstream_dependents
  - capability_gap_analysis.py dependent_capabilities and dependencies
  - application_rationalization.py integration_dependencies
  - consolidation_list.py dependencies
  - implementation_planning.py work_dependencies
  reason: A second dependency store beside archimate_relationships; the derivation and impact-analysis register entries forbid a second walker. UnifiedWorkPackage.work_dependencies stays listed (IW-18) as package sequencing, not architecture dependency.
- id: IW-54
  fact: Hand-entered stand-ins for measured operations data
  where:
  - ApplicationComponent.current_uptime_percentage
  - availability_actual
  - current_response_time_ms
  - current_throughput_tps; capability_to_vendor_mapping.py uptime_percentage
  - incident_count_90days
  - last_incident_date; application_lifecycle.py utilisation percentages; IntegrationMetadata.current_uptime_percentage
  reason: Class D measurements typed into class B columns; forbids copying incidents or telemetry into model tables, and the Operational adapter contract is the only path for them. Recorded targets (IW-27, IW-28) stay; measured actuals do not.
- id: IW-55
  fact: Self-rated value, satisfaction and ROI figures on the application record
  where:
  - ApplicationComponent.roi_score
  - user_satisfaction_score
  - performance_rating
  - business_value
  - defect_density
