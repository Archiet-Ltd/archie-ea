pipeline_rule:
  statement: 'A new fact-bearing field (any column in a model under app/models or app/modules/*/models whose name matches the fact families: maturity, assessment, health, cost, budget, tco, spend, licence, renewal, contract, vendor, lifecycle, eol, retire, decommission, risk, compliance, control, sla, availability, rto, rpo, criticality, owner, raci, usage, plateau, gap, roadmap, milestone, baseline, drift, score) is not merged without a row in this register that is either wired (lens or engine named, reason code named) or listed under not_intelligence with a reason.'
