  - id: comment-blanking
    name: Blanking a comment before testing text for a pattern
    plain_words: >-
      Replace a comment's characters with spaces, keeping line breaks, so a pattern that quotes an
      anti-pattern in its own documentation is not read as a real instance of it, or so a comment cannot
      forge a match a rule requires for something to be allowed.
    decision: chosen
    decision_owner: tech-lead
    canonical:
      kind: pattern
      paths: [scripts/check_broken_surfaces.py]
      use: "_blank_comments(text, jinja=True) in check_broken_surfaces.py -- one character scan blanking {# #} (when jinja=True), /* */ and // while preserving newlines; the fullest form of the technique in the suite"
    allowed_specialisations:
      - path: scripts/check_reuse.py
        reason: >-
          Every checker in this suite is self-contained and there are no cross-imports between its eighty
          scripts; consolidating the comment-blanking helpers into a shared module would create the first
          cross-import in the suite, the same reason accepted for the shared macro index inside
          check_reuse.py itself. This copy additionally blanks HTML comments, which the canonical does not
          need.
        accepted_by: tech-lead
        review_by: 2026-12-31
      - path: scripts/check_macro_kwargs.py
        reason: Same house reason as check_reuse.py's copy -- no cross-imports between checkers, so each keeps its own.
        accepted_by: tech-lead
        review_by: 2026-12-31
      - path: scripts/check_duplicate_breadcrumb.py
        reason: Same house reason -- no cross-imports between checkers, so each keeps its own.
        accepted_by: tech-lead
        review_by: 2026-12-31
    forbidden:
      - A fifth copy of this technique added without recording, in this entry, why it could not reuse one of the four already in the tree.
    rules: []
    known_duplicates:
      - {path: scripts/check_macro_kwargs.py, verdict: specialisation, converge: S}
      - {path: scripts/check_duplicate_breadcrumb.py, verdict: specialisation, converge: S}
      - {path: scripts/check_reuse.py, verdict: specialisation, converge: S}
    converge_effort: S
    owner_role: tech-lead
    search_hints:
      - "grep -ln \"blank_comments\\|_mask_comments\" scripts/*.py"
    last_checked: *v
