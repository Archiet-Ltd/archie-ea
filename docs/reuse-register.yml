      symbols: [site_registry, items_needing_own_page]
    reuse: >
      Add, move or relabel a public navbar, menu or footer link in content/site/registry.yml only; the navbar
      (components/public_navbar.html), the menu rows (components/public_menu.html), the footer
      (components/public_footer.html) and the roles hub read it through site_registry(). Labels and one-line
