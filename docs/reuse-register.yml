  - id: owner-record
    concept: The individual owner of an application, capability or element (the record itself, as opposed to its display rows)
    status: active
    canonical:
      path: app/services/element_ownership_service.py
      symbols:
        - set_element_owner
        - set_application_owner
        - application_owner_text
        - application_owner_expression
        - application_is_owned_expression
        - application_is_owned
        - resolve_user_by_name
    reuse: >
      An owner is a person recorded as an ApplicationOwner row, written only through set_element_owner (an
      application is element_type "application"). The business_owner, technical_owner and application_owner
      fields on an application are attributes that read and assign through that service, so assigning them
      is allowed and records the owner; in SQL use the same attributes, which carry the matching expression.
      The legacy_* columns behind them hold only a name that matched no user and are written by the service and
      the backfill alone. Do not write a second owner row, a second name-to-user lookup, or read an owner text
      column directly. The retirement of those columns is a named follow-up, not part of this entry.
      "Owned" (an application has an accountable owner: a primary or business owner record, or a legacy
      application or business owner text) is defined once, by application_is_owned_expression and
      application_is_owned; the dashboard owner coverage and the Ask question on applications with no owner
      both read it. Do not write another owned count.
    must_not_create:
      - id: owner-name-resolver
        regex: 'def\s+_?resolve_(user|owner)_by_name\s*\('

  - id: org-unit-owner
    concept: Which organisation unit holds an application (budget holder, product owner, percentage and dates)
    status: active
    canonical:
      path: app/models/enterprise_intelligence.py
      symbols: [ApplicationOwnership]
    reuse: >
      A different question from owner-record: the unit that holds the application, not the person who owns
      it. Read it through ApplicationOwnership and the intelligence query service; do not store a unit in
      ApplicationOwner or a person in ApplicationOwnership. The named contact on a unit row is a convenience
      the owner backfill copies across as a person; it does not make the two records one.

  - id: archimate-drawing-engine
    concept: Drawing an ArchiMate model as a diagram (nodes, links, layers, bands), editable or read-only
    status: active
    canonical:
      path: app/static/js/archimate/composer_renderer.js
      symbols: [ComposerRenderer]
    reuse: >
      Draw ArchiMate elements and relationships with ComposerRenderer.create(container, options) and its
      methods (loadElements, update, setSelected, setCentre, setHighlightedEdges, getNodeBounds, resize,
      fitToContent, destroy). Layer bands, provenance styling (recorded and worked-out connections), compact
      nodes and token colours are options on that one engine, all off unless asked for. Do not add a second
      JointJS or D3 diagram renderer for ArchiMate content: extend this one, or add a sibling module it loads.
    must_not_create:
      - id: second-archimate-renderer
        regex: '(?i)(?:let|const|var|function|class)\s+\w*archimate\w*(?:renderer|diagramengine)\b'
        scope: [app/static/js, app/templates]
        suffixes: [.js, .html]

  - id: composer-radial-arrangement
    concept: Arranging the elements of a view round one element, each step away on its own ring (the Composer's neighbourhood view)
    status: active
    canonical:
      path: app/static/js/archimate/composer.js
      symbols: [applyRadialLayout, applyLayerBanding]
    reuse: >
      applyRadialLayout is the one radial arrangement, beside applyLayerBanding, which arranges by layer. It shares
      LAYER_Y_ORDER with layer banding, and the drawing is then fitted by the one fitCanvas. A view about one element
      calls it; do not write a second radial, circular or ring layout or a second fit or zoom routine in the Composer.

  - id: diagram-editor-shell
    concept: The editor chrome around an ArchiMate diagram (toolbar, element palette, finder, relationship legend, minimap, status line, header, properties sheet)
    status: active
    canonical:
