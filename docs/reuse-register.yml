    concept: The public site roadmap stepper (a row of stages with a line and a dot)
    status: active
    canonical:
      path: app/static/css/public_site.css
      symbols: [".public-stepper"]
    reuse: >
      Public pages (the homepage, the pricing page and any new marketing page) use these classes from
      public_site.css; the authenticated app uses components/stepper.html. Neither side defines a copy of
      the other. Do not write a second rule for this component in another stylesheet or an inline <style>; a
      page-specific layout is a rule on the page's own wrapper that does not restyle the shared component.
      The gate flags a class rule whose name contains the component word, bare or prefixed, other than the
      canonical class; and any rule outside public_site.css whose selector names the canonical class and
      sets padding, border, radius, font, line height, letter spacing, text transform or decoration, colour,
      background, shadow, outline, height or opacity (layout properties such as display, grid, flex, width,
      margin, position and overflow are allowed). Not seen by the gate: attribute selectors and the bare
      Tailwind utility name .grow; review catches those.
    must_not_create:
      - id: second-stepper-rule
        regex: '^(?:[^\n{}]*[{}])*?[^\n{}]*?(?<![\w-])(?:(?:a|button|div|span|li|ul|ol|article|section|details|summary|table|thead|tbody|tr|td|th|p|h[1-6]|aside|dl|dt|dd|figure)(?![\w-]))?\.(?!(?:public-stepper(?:__[\w]+)?|grow(?:-0)?|flex-grow(?:-0)?)(?![\w-]))(?:[\w-]*[-_])?(?:stepper|steps|roadmap|grow|timeline)(?![a-zA-Z0-9])[^\n{}]*(?:\{|,\s*$)'
        scope: [app/static/css, app/templates]
        suffixes: [.css, .html]
      - id: restyled-stepper
        regex: '^(?:[^\n{}]*[{}])*?[^\n{}]*?(?<![\w-])(?:(?:a|button|div|span|li|ul|ol|article|section|details|summary|table|thead|tbody|tr|td|th|p|h[1-6]|aside|dl|dt|dd|figure)(?![\w-]))?\.public-(?:stepper)(?![a-zA-Z0-9])[^{}]*\{[^{}]*?(?<![\w-])(?:padding|border(?!-(?:collapse|spacing))|font|line-height|letter-spacing|text-transform|text-decoration|color|background|box-shadow|outline|height|min-height|opacity)[\w-]*\s*:'
        scope: [app/static/css, app/templates]
        suffixes: [.css, .html]
    known_exceptions:
      - path: app/static/css/vendor/
        reason: third-party stylesheets, not ours to change
      - path: app/static/css/tailwind-output*
        reason: generated Tailwind utility output (minified), rebuilt from templates by scripts/build_css.py

  - id: component-inventory
    concept: Component inventory generator (routes, buttons, forms, tables, modals, endpoints from templates)
    status: active
    canonical:
      path: scripts/component_inventory.py
      symbols: [build_inventory, main, route_entries, handler_place, controls_for_template]
    reuse: >
      The component inventory is generated by scripts/component_inventory.py. It reads every Jinja template,
      walks the Jinja AST for macro calls and url_for references, reconstructs HTML from lex tokens,
      and maps each route to its rendered template with all interactive elements. Do not write a second
      generator or a second route-to-template mapper; reuse the canonical script and its build_inventory()
      function. The output docs/component-inventory.json is the single source of truth for Phase 1 click audits, and the one reader of routes (with each handler file and line) and forms (with line, id, action and button formaction) that scripts/sysml/as_built.py takes them from.
    must_not_create:
      - id: second-inventory-generator
        regex: 'def\s+build_inventory\s*\('
        scope: [scripts]
        suffixes: [.py]
      - id: second-route-template-mapper
        regex: '_render_target|route_templates|template_files\(\)'
        scope: [scripts]
        suffixes: [.py]
    known_exceptions:
      - path: scripts/check_canonical_route.py
        reason: provides _rules() for route enumeration (reused by component_inventory.py)
      - path: scripts/check_template_syntax.py
        reason: provides template_files() for template discovery (reused by component_inventory.py)
      - path: scripts/check_template_references.py
        reason: provides _render_target() for render_template extraction (reused by component_inventory.py)
      - path: scripts/check_macro_kwargs.py
        reason: provides collect_signatures() for macro signatures (reused by component_inventory.py)

