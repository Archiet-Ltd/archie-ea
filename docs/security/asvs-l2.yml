# OWASP ASVS 4.0.3 level 2 register, mapped per route family.
#
# This file records, for each applicable ASVS level 2 requirement and each route
# family (a Flask blueprint), either the test node id that proves the control or
# a short description of the control with the file that carries it. The gate
# scripts/check_asvs_register.py reads this file and proves every cited test node
# id and control file actually exists, so the register can never promise a
# control that nobody runs.
#
# Founder ruling (free route): this register, the two-organisation test suites
# and the ZAP scans together stand in place of a bought outside penetration
# test. Nothing here states or implies that an independent or outside penetration
# test has been carried out; these are our own tests and our own scans.
#
# The seven startup route families come first (account, admin connectors,
# intelligence, applications, admin billing, admin team, dashboard). For each of
# them, every applicable V4 (access control) requirement is backed by a real
# two-organisation test node id. Chapters covered, per the strategy: V2
# authentication, V3 session, V4 access control, V5 validation and encoding, V7
# errors and logging, V8 data protection, V9 communications, V13 API, V14
# configuration.
#
# Row fields:
#   id        ASVS 4.0.3 requirement id (e.g. V4.1.1)
#   family    route family (blueprint), or a cross-cutting family name
#   applies   true, or false with a reason recorded in evidence
#   evidence  a list of test node ids (path/to/test.py::test_name or
#             path/to/test.py::Class::test_name) OR a control description that
#             names a real file path
#   status    pass (evidence resolves) or fail (open gap, names brief T-qa-13)
#
# A status:fail row names the brief T-qa-13 that tracks closing the gap; it never
# names a path to the brief.

