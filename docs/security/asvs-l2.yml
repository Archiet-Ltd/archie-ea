# OWASP ASVS 4.0.3 level 2 register, mapped per route family.
#
# This file records, for each applicable ASVS level 2 requirement and each route
# family (a Flask blueprint, or a cross-cutting family name), either the test
# node id that proves the control or a short description of the control with the
# file that carries it. The gate scripts/check_asvs_register.py reads this file
# and proves every cited test node id and control file actually exists, so the
# register can never promise a control that nobody runs.
#
# Founder ruling (free route): this register, the two-organisation test suites
# and the ZAP scans together stand in place of a bought outside penetration
# test. Nothing here states or implies that an independent or outside penetration
# test has been carried out; these are our own tests and our own scans.
#
# Coverage: the nine chapters named in the strategy are mapped for every route
# family listed below, each requirement either applied (with resolvable evidence)
# or marked applies:false with a concrete reason. The chapters are V2
# authentication, V3 session management, V4 access control, V5 validation /
# sanitisation / encoding, V7 error handling and logging, V8 data protection, V9
# communications, V13 API and web service, V14 configuration.
#
# The seven startup route families (account; admin connectors =
# m365_connector/connectors; intelligence = intelligence_api/intelligence_ui;
# applications = unified_applications/application_mgmt/my_applications; admin
# billing = billing; admin team = team; dashboard = dashboard/dashboard_pages)
# each carry a V4 (access control) row whose evidence is a genuine
# two-organisation test node id: a test that builds a second organisation and
# drives that family's own routes, asserting the second organisation sees
# nothing of the first.
#
# Row fields:
#   id        ASVS 4.0.3 requirement id (e.g. V4.1.1)
#   family    route family (blueprint), or a cross-cutting family name
#   applies   true, or false with a reason recorded in evidence
#   evidence  a list of test node ids (path/to/test.py::test_name or
#             path/to/test.py::Class::test_name) OR a control description that
#             names a real FILE path (a bare directory does not resolve; a bare
#             word never resolves)
#   status    pass (evidence resolves and exercises the requirement) or fail
#             (open gap, names a real follow-up brief by id)
#
# A status:fail row names the real follow-up brief by id (a token matching
# T-[a-z]+-\d+) that tracks closing the gap; it never names the brief this
# register was authored under as its own follow-up (that would be circular).

