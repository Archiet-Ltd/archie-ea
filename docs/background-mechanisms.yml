# Every background-work mechanism in the application, in one list.
# Checked by scripts/check_background_mechanisms.py (gate: background-mechanisms).
#
# kind:        rq | celery | apscheduler | thread | process-pool | subprocess | other
# class:       queue | scheduler | request-helper | generated-code
# disposition: keep | move-to-pool | retire-after-pool | out-of-scope
#
# One entry per file, kind and entry function (an optional `instances: N` says
# the function starts N of them). A file that starts a mechanism in a function
# with no entry here fails the gate, so a second pool added to an already listed
# file is caught; so does an entry whose file or function no longer uses it, an
# entry naming a file that does not exist (`other` entries included) and a
# duplicate key. The number of thread instances and the number of files holding
# them may only fall. For rq, celery, apscheduler and multiprocessing the
# construct is the import, so the entry function is the scope of the first
# import, usually <module>.
#
# Scanned: app/**/*.py and manage.py (it holds the RQ worker command).
# Not scanned: generated customer code under app/modules/solutions_product/templates/,
# and test code. Detached subprocesses (a subprocess.Popen whose enclosing function
# never waits on it) and os.fork are the `subprocess` kind.
#
# Excluded on purpose: asyncio.to_thread and loop.run_in_executor. They run one
# call on the event loop's default executor and the request that made them awaits
# the result, so they neither outlive the request nor own a pool or a thread. A
# call that starts its own thread or pool is a `thread` entry. subprocess.run and
# the check_* helpers are synchronous and not mechanisms either.
#
# Follow-up notes (not mechanisms; nothing here is gated):
# - app/modules/admin/v2/services/abacus_sync_service_v2.py is still a near
#   duplicate of app/services/abacus_sync_service.py and admin_routes.py still
#   imports it. Merge it into the one service in the next job-queue change.
mechanisms:
- kind: apscheduler
  file: app/_bootstrap/extensions.py
  entry: init_scheduler
  purpose: Registers every scheduled job (workflow schedules, error events, capability projection, waiver
    expiry) on one BackgroundScheduler
  class: scheduler
  disposition: move-to-pool
  tenant_context: each job runs through the tenant-safe job harness (run_for_each_tenant / tenant_scope);
    platform jobs are declared in PLATFORM_JOBS and guarded by job_lock
- kind: rq
  file: app/_bootstrap/extensions.py
  entry: init_extensions
  purpose: Creates the Flask-RQ queue extension used by the worker image
  class: queue
  disposition: move-to-pool
  tenant_context: 'none: the extension only holds the queue; each enqueuing caller passes its own organisation
    in the job arguments'
- kind: thread
  file: app/_bootstrap/routes.py
  entry: _register_health_check._probe_with_timeout
  purpose: Runs a health probe on a thread so a hung dependency cannot hold the health route past its
    timeout
  class: request-helper
  disposition: keep
  tenant_context: 'none: platform-wide work, not tied to one organisation'
- kind: thread
  file: app/application_mgmt/import_routes.py
  entry: analyze_import.run_with_timeout
  purpose: Runs one analysis call on a single-worker pool to bound its time inside the request
  class: request-helper
  disposition: keep
  tenant_context: the request's organisation scope is read before the call; the pool does no tenant queries
- kind: other
  file: app/jobs/worker.py
  entry: main
  purpose: 'Process that keeps the scheduler alive: the scheduled jobs run on its APScheduler threads,
    outside the web process'
  class: scheduler
  disposition: move-to-pool
  tenant_context: every job it hosts runs through the tenant-safe job harness
- kind: rq
  file: app/modules/account/services/account_service.py
  entry: <module>
  purpose: Queues outgoing account e-mail on the Flask-RQ queue when it is installed
  class: queue
  disposition: move-to-pool
  tenant_context: 'none: the e-mail is fully rendered before it is queued'
- kind: thread
  file: app/modules/admin/connector_routes.py
