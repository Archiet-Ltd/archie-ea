openapi: 3.1.0
info:
  title: Entelim Enterprise Intelligence API
  version: 1.0.0
  summary: 'Public and partner API for the Entelim enterprise intelligence platform:
    the enterprise model, the knowledge graph, intelligence, agents, ingestion, events
    and administration.'
  description: One API over one model. Every resource belongs to exactly one organisation,
    which is taken from the access token and never from the request. Reads can be
    taken at a past date with asOf. Every write is versioned, audited and emits a
    domain event through the transactional outbox. Machine clients write through change
    proposals that a person approves, unless an organisation administrator has granted
    direct write to that client. Errors are RFC 9457 problem details. Collections
    page by cursor. Creates and job starts accept an Idempotency-Key. Rate limits
    are announced in RateLimit and RateLimit-Policy headers. The MCP server exposes
    the same capabilities to AI assistants through one tool catalogue.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: Entelim
    url: https://entelim.org
  x-api-lifecycle:
    versioning: 'Major version in the path (/v1). Within a major version only additive
      changes ship: new operations, new optional fields, new enum values that clients
      must tolerate. A breaking change ships as /v2 with at least twelve months of
      overlap.'
    deprecation: A deprecated operation answers with Deprecation (RFC 9745) and Sunset
      (RFC 8594) headers and a Link rel=deprecation to the migration note, at least
      six months before removal.
    unknown_fields: Clients must ignore unknown response fields and unknown enum values;
      the server rejects unknown request fields with 422 so typos never pass silently.
    stability: operationId, schema names, scope names, problem types and event types
      are stable identifiers.
