    EntityWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type:
          - string
          - 'null'
          maxLength: 50000
        valid_from:
          type: string
          format: date-time
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
        properties:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
        accountability:
          type: array
          items:
            type: object
            properties:
              accountability_type:
                type: string
              holder_person_id:
                $ref: '#/components/schemas/Id'
              holder_unit_id:
                $ref: '#/components/schemas/Id'
            additionalProperties: false
            required:
            - accountability_type
          description: Creates or replaces Accountability Assignments in the same
            transaction.
        external_identifiers:
          type: array
          items:
            type: object
            properties:
              source_system_id:
                $ref: '#/components/schemas/Id'
              external_key:
                type: string
              key_type:
                type: string
            additionalProperties: false
            required:
            - source_system_id
            - external_key
        change_note:
          type: string
          maxLength: 2000
          description: Why the change was made; kept in history and the audit trail.
    ExternalIdentifier:
      description: 'External Identifier: The identifier crosswalk row.'
      allOf:
      - $ref: '#/components/schemas/EntityBase'
      - $ref: '#/components/schemas/ExternalIdentifierAttributes'
      - type: object
        properties:
          lifecycle_state:
            type: string
            enum:
            - recorded
            - corrected
            - superseded
            readOnly: true
            description: States of lifecycle set LC-RECORD.
        additionalProperties: false
      x-entity-id: ENT-0182
      x-ontology-class: ONT-0178 External Identifier
      x-archimate: Property (identifier)
      x-scope: tenant
      x-identity-key: source_system_id + key_type + external_key (unique per tenant)
      x-lifecycle-set: LC-RECORD
      unevaluatedProperties: false
    ExternalIdentifierAttributes:
      type: object
      properties:
        subject_entity_id:
          $ref: '#/components/schemas/EntityRef'
          description: Reference to any element; its type is carried in the paired
            subject_type field.
        subject_type:
          type: string
          maxLength: 500
        source_system_id:
          $ref: '#/components/schemas/EntityRef'
          x-target-entity: SourceSystem
        external_key:
          type: string
          maxLength: 500
        key_type:
          type: string
          maxLength: 500
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
      description: Attributes specific to External Identifier (ENT-0182).
    Id:
      type: string
      format: uuid
      description: UUID v7 (time-ordered) surrogate id. Never reused; stable across
        renames and re-imports.
    PageInfo:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
        total_estimate:
          type:
          - integer
          - 'null'
          description: Estimated count when cheap to compute; null otherwise, never
            zero as a stand-in.
        as_of:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - next_cursor
      - limit
      - as_of
    Problem:
      description: 'Problem: An underlying cause of incidents.'
      allOf:
      - $ref: '#/components/schemas/EntityBase'
      - $ref: '#/components/schemas/ProblemAttributes'
      - type: object
        properties:
          lifecycle_state:
            type: string
            enum:
            - open
            - acknowledged
            - mitigated
            - resolved
            - closed
            readOnly: true
            description: States of lifecycle set LC-INCIDENT.
        additionalProperties: false
      x-entity-id: ENT-0159
      x-ontology-class: ONT-0154 Problem
      x-archimate: Assessment (problem)
      x-scope: tenant
      x-identity-key: tenant_id + source_system + external_key
      x-lifecycle-set: LC-INCIDENT
      unevaluatedProperties: false
    ProblemAttributes:
      type: object
      properties:
        external_key:
          type: string
          maxLength: 500
        known_error:
          type: boolean
        workaround:
          type: string
          maxLength: 50000
      description: Attributes specific to Problem (ENT-0159).
    Provenance:
      type: object
      properties:
        truth_class:
          type: string
          enum:
          - recorded
          - imported
          - synchronised
          - derived
          - inferred
          - estimated
          description: How the fact came to be known (entity catalogue common attribute).
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        primary_source_system:
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
          description: Source System (ENT-0179) that masters this record.
        ingestion_run:
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        change_proposal:
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          description: Assertions (ENT-0184) behind the current values.
        derived_fact:
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        recorded_by:
          $ref: '#/components/schemas/EntityRef'
        recorded_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - truth_class
      - recorded_at
      description: Where a fact came from. Every record, relationship and answer row
        carries one.
    ValueStream:
      description: 'Value Stream: An end-to-end value stream delivering a result to
        a triggering stakeholder.'
      allOf:
      - $ref: '#/components/schemas/EntityBase'
      - $ref: '#/components/schemas/ValueStreamAttributes'
      - type: object
        properties:
          lifecycle_state:
            type: string
            enum:
            - draft
            - proposed
            - approved
            - superseded
            - rejected
            readOnly: true
            description: States of lifecycle set LC-DESIGN.
        additionalProperties: false
      x-entity-id: ENT-0002
      x-ontology-class: ONT-0004 Value Stream
      x-archimate: Value Stream
      x-scope: tenant
      x-identity-key: tenant_id + normalised name
      x-lifecycle-set: LC-DESIGN
      unevaluatedProperties: false
    ValueStreamAttributes:
      type: object
      properties:
        triggering_stakeholder_id:
          $ref: '#/components/schemas/EntityRef'
          x-target-entity: Stakeholder
        value_proposition:
          type: string
          maxLength: 50000
        customer_facing:
          type: boolean
      description: Attributes specific to Value Stream (ENT-0002).
    ValueStreamCreate:
      allOf:
      - $ref: '#/components/schemas/EntityWrite'
      - $ref: '#/components/schemas/ValueStreamAttributes'
      required:
      - name
      unevaluatedProperties: false
      x-entity-id: ENT-0002
    ValueStreamPage:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ValueStream'
        page:
          $ref: '#/components/schemas/PageInfo'
    ValueStreamPatch:
      description: JSON Merge Patch (RFC 7396); null removes a value.
      allOf:
      - $ref: '#/components/schemas/EntityWrite'
      - $ref: '#/components/schemas/ValueStreamAttributes'
      unevaluatedProperties: false
      x-entity-id: ENT-0002
