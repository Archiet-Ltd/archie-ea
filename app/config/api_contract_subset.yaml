components:
  headers:
    ETag:
      description: Strong entity tag of the returned version.
      schema:
        type: string
    Link:
      description: 'RFC 8288 links: next, prev, first.'
      schema:
        type: string
    RateLimit:
      description: Remaining quota for the current window (IETF RateLimit header fields).
      schema:
        type: string
      example: '"read";r=1180;t=42'
    RateLimitPolicy:
      description: Quota policy that applies to this operation.
      schema:
        type: string
      example: '"read";q=1200;w=60'
    RequestId:
      description: Identifier of this request, also carried in problem details and
        the audit trail.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    WWWAuthenticate:
      description: Bearer challenge with resource_metadata pointing at the protected-resource
        metadata, and error and scope where relevant.
      schema:
        type: string
      example: Bearer resource_metadata="https://entelim.org/.well-known/oauth-protected-resource",
        error="invalid_token"
  parameters:
    AsOf:
      name: asOf
      in: query
      description: 'Read the state as recorded at this instant (bitemporal: valid
        and recorded time). Defaults to now.'
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from page.next_cursor or page.prev_cursor.
      schema:
        type: string
        maxLength: 1000
    Fields:
      name: fields
      in: query
      description: 'Sparse fieldset: comma-separated fields to return.'
      schema:
        type: string
        maxLength: 1000
    Filter:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: 'Field filters, e.g. filter[lifecycle]=live&filter[updated_at][gte]=2026-01-01.
        Operators: eq, ne, in, nin, gt, gte, lt, lte, contains, exists.'
      schema:
        type: object
        additionalProperties: true
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        $ref: '#/components/schemas/Id'
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Return 304 when the ETag still matches.
      schema:
        type: string
    Include:
      name: include
      in: query
      description: Comma-separated reference fields to expand inline, one level deep.
      schema:
        type: string
        maxLength: 500
    IncludeRetired:
      name: includeRetired
      in: query
      description: Include retired records.
      schema:
        type: boolean
        default: false
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Q:
      name: q
      in: query
      description: Free-text search within the collection.
      schema:
        type: string
        maxLength: 500
    Scenario:
      name: scenario
      in: query
      description: Read through a scenario's hypothetical changes instead of the baseline
        model.
      schema:
        $ref: '#/components/schemas/Id'
    ScopeParam:
      name: scope
      in: query
      description: 'For hybrid and reference entities: tenant rows, shared reference
        rows, or both.'
      schema:
        type: string
        enum:
        - tenant
        - shared
        - all
        default: all
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix with - for descending.
      schema:
        type: string
        maxLength: 200
      example: -updated_at,name
    ValidAt:
      name: validAt
      in: query
      description: Read the state that was true in the world at this instant, as currently
        known.
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: 'The request is malformed: bad syntax, bad parameter or unknown
        filter field.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token lacks the scope, or the principal's role lacks the permission,
        for this operation.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The resource was retired into another; the problem's retired_into
        field names it.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 'Unexpected server failure. It is never reported as data: the body
        is a problem, not an empty result.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this organisation. Resources of other organisations
        are indistinguishable from absent ones.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency is unavailable (model provider, connector, search
        index). The problem names which; partial answers are never returned as complete.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid access token. The WWW-Authenticate header points to the
        protected-resource metadata.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
