components:
  headers:
    ETag:
      description: Strong entity tag of the returned version.
      schema:
        type: string
    IdempotentReplayed:
      description: true when this response is a replay of an earlier request with
        the same Idempotency-Key.
      schema:
        type: boolean
    Link:
      description: 'RFC 8288 links: next, prev, first.'
      schema:
        type: string
    Location:
      description: URL of the created resource or job.
      schema:
        type: string
        format: uri-reference
    RateLimit:
      description: Remaining quota for the current window (IETF RateLimit header fields).
      schema:
        type: string
      example: '"read";r=1180;t=42'
    RateLimitPolicy:
      description: Quota policy that applies to this operation.
      schema:
        type: string
      example: '"read";q=1200;w=60'
    RequestId:
      description: Identifier of this request, also carried in problem details and
        the audit trail.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    WWWAuthenticate:
      description: Bearer challenge with resource_metadata pointing at the protected-resource
        metadata, and error and scope where relevant.
      schema:
        type: string
      example: Bearer resource_metadata="https://entelim.org/.well-known/oauth-protected-resource",
        error="invalid_token"
  parameters:
    AsOf:
      name: asOf
      in: query
      description: 'Read the state as recorded at this instant (bitemporal: valid
        and recorded time). Defaults to now.'
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from page.next_cursor or page.prev_cursor.
      schema:
        type: string
        maxLength: 1000
    Fields:
      name: fields
      in: query
      description: 'Sparse fieldset: comma-separated fields to return.'
      schema:
        type: string
        maxLength: 1000
    Filter:
      name: filter
      in: query
      style: deepObject
      explode: true
      description: 'Field filters, e.g. filter[lifecycle]=live&filter[updated_at][gte]=2026-01-01.
        Operators: eq, ne, in, nin, gt, gte, lt, lte, contains, exists.'
      schema:
        type: object
        additionalProperties: true
    Id:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key (UUID or ULID) for this request; retries with the same
        key return the first response.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being changed; a stale value is refused with
        412.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Return 304 when the ETag still matches.
      schema:
        type: string
    Include:
      name: include
      in: query
      description: Comma-separated reference fields to expand inline, one level deep.
      schema:
        type: string
        maxLength: 500
    IncludeRetired:
      name: includeRetired
      in: query
      description: Include retired records.
      schema:
        type: boolean
        default: false
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Q:
      name: q
      in: query
      description: Free-text search within the collection.
      schema:
        type: string
        maxLength: 500
    Scenario:
      name: scenario
      in: query
      description: Read through a scenario's hypothetical changes instead of the baseline
        model.
      schema:
        $ref: '#/components/schemas/Id'
    ScopeParam:
      name: scope
      in: query
      description: 'For hybrid and reference entities: tenant rows, shared reference
        rows, or both.'
      schema:
        type: string
        enum:
        - tenant
        - shared
        - all
        default: all
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix with - for descending.
      schema:
        type: string
        maxLength: 200
      example: -updated_at,name
    ValidAt:
      name: validAt
      in: query
      description: Read the state that was true in the world at this instant, as currently
        known.
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: 'The request is malformed: bad syntax, bad parameter or unknown
        filter field.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'The request conflicts with current state: duplicate external identifier,
        relationship not allowed by the ontology, or a job already running.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentTooLarge:
      description: The body exceeds the operation's size limit; use a bulk job or
        an ingestion batch.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token lacks the scope, or the principal's role lacks the permission,
        for this operation.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The resource was retired into another; the problem's retired_into
        field names it.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 'Unexpected server failure. It is never reported as data: the body
        is a problem, not an empty result.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such resource in this organisation. Resources of other organisations
        are indistinguishable from absent ones.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: If-Match does not match the current version.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match is required for this write.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A dependency is unavailable (model provider, connector, search
        index). The problem names which; partial answers are never returned as complete.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid access token. The WWW-Authenticate header points to the
        protected-resource metadata.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: 'The body is well-formed but invalid: schema violation, unknown
        field, ontology rule or policy rule broken, or idempotency key reused with
        a different body.'
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The content type is not accepted by this operation.
      headers:
        Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Capability:
      description: 'Capability: A business capability at level 0 to 3 of the capability
        map, the anchor most questions are asked against.'
      allOf:
      - $ref: '#/components/schemas/EntityBase'
      - $ref: '#/components/schemas/CapabilityAttributes'
      - type: object
        properties:
          lifecycle_state:
            type: string
            enum:
            - draft
            - proposed
            - approved
            - superseded
            - rejected
            readOnly: true
            description: States of lifecycle set LC-DESIGN.
        additionalProperties: false
      x-entity-id: ENT-0001
      x-ontology-class: ONT-0003 Capability
      x-archimate: Capability
      x-scope: hybrid
      x-identity-key: tenant_id + normalised name + parent_capability_id
      x-lifecycle-set: LC-DESIGN
      unevaluatedProperties: false
    CapabilityAttributes:
      type: object
      properties:
        level:
          type: integer
        parent_capability_id:
          $ref: '#/components/schemas/EntityRef'
          x-target-entity: Capability
        reference_entry_id:
          $ref: '#/components/schemas/EntityRef'
          x-target-entity: ReferenceModelEntry
        maturity_current:
          type: integer
        maturity_target:
          type: integer
        strategic_importance:
          type: string
          enum:
          - core
          - differentiating
          - supporting
          - commodity
        heat:
          type: string
          enum:
          - low
          - medium
          - high
      description: Attributes specific to Capability (ENT-0001).
    CapabilityCreate:
      allOf:
      - $ref: '#/components/schemas/EntityWrite'
      - $ref: '#/components/schemas/CapabilityAttributes'
      required:
      - name
      - level
      unevaluatedProperties: false
      x-entity-id: ENT-0001
    CapabilityPage:
      type: object
      required:
      - data
      - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        page:
          $ref: '#/components/schemas/PageInfo'
    CapabilityPatch:
      description: JSON Merge Patch (RFC 7396); null removes a value.
      allOf:
      - $ref: '#/components/schemas/EntityWrite'
      - $ref: '#/components/schemas/CapabilityAttributes'
      unevaluatedProperties: false
      x-entity-id: ENT-0001
    ElementDetail:
      allOf:
      - $ref: '#/components/schemas/ElementSummary'
      - type: object
        properties:
          scope:
            type: string
          building_block_type:
            type: string
          plateau:
            type: string
    ElementListPage:
      type: object
      required:
      - elements
      - pagination
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ElementSummary'
        pagination:
          type: object
          required:
          - page
          - per_page
          - total
          - pages
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            pages:
              type: integer
    ElementSummary:
      type: object
      required:
      - id
      - name
      - type
      - layer
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        layer:
          type: string
        description:
          type: string
    EntityBase:
      type: object
      description: The common attributes of the entity catalogue, carried by every
        record.
      required:
      - id
      - type
      - tenant_id
      - name
      - lifecycle_state
      - valid_from
      - recorded_at
      - version
      - truth_class
      - confidence
      - created_by
      - updated_by
      properties:
        id:
          $ref: '#/components/schemas/Id'
          readOnly: true
        type:
          $ref: '#/components/schemas/EntityTypeKey'
          readOnly: true
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: Owning tenant; null only on shared reference rows.
        scope:
          type: string
          enum:
          - tenant
          - reference
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 500
        normalised_name:
          type: string
          readOnly: true
        description:
          type:
          - string
          - 'null'
          maxLength: 50000
        lifecycle_state:
          type: string
          readOnly: true
          description: State from the entity's lifecycle set; changed through the
            transitions operation.
        archimate_type:
          type:
          - string
          - 'null'
          readOnly: true
        valid_from:
          type: string
          format: date-time
          description: When this state became true in the world.
        valid_to:
          type:
          - string
          - 'null'
          format: date-time
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        superseded_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        etag:
          type: string
          readOnly: true
        truth_class:
          type: string
          enum:
          - recorded
          - imported
          - synchronised
          - derived
          - inferred
          - estimated
          readOnly: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
          readOnly: true
        primary_source_system_id:
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
          readOnly: true
        created_by:
          $ref: '#/components/schemas/EntityRef'
          readOnly: true
        updated_by:
          $ref: '#/components/schemas/EntityRef'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        retired_into_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
          readOnly: true
        properties:
          type: object
          additionalProperties: true
          description: Tenant-defined attributes, validated against the tenant's attribute
            definitions (property templates).
        accountability:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              accountability_type:
                type: string
              holder:
                oneOf:
                - $ref: '#/components/schemas/EntityRef'
                - type: 'null'
            additionalProperties: false
          description: Accountability Assignments (ENT-0141) for this record; an empty
            list means not recorded and is shown as such.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          description: Tags (ENT-0209).
        external_identifiers:
          type: array
          items:
            $ref: '#/components/schemas/ExternalIdentifier'
          readOnly: true
        provenance:
          $ref: '#/components/schemas/Provenance'
          readOnly: true
        links:
          type: object
          readOnly: true
          additionalProperties:
            type: string
            format: uri-reference
    EntityRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/EntityTypeKey'
        entity_id:
          type: string
          pattern: ^ENT-[0-9]{4}$
          readOnly: true
        name:
          type: string
          maxLength: 500
          readOnly: true
        href:
          type: string
          format: uri-reference
          readOnly: true
      additionalProperties: false
      required:
      - id
      description: Reference to another record. On write only id is read; the type
        is checked against the relationship catalogue.
