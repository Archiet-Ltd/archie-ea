schema_version: 1
key: data_ai
name: Data and AI
summary: Stand up a governed data platform and put the first AI-assisted use cases on it.
vendor_specific: false
arb_required_at_decide: false
workstreams:
- key: data_platform
  name: Data platform
  workstream_type: technology
  objective: Own the data platform work this programme depends on.
- key: governance_and_quality
  name: Governance and quality
  workstream_type: data
  objective: Own the governance and quality work this programme depends on.
- key: use_cases
  name: Use cases
  workstream_type: other
  objective: Own the use cases work this programme depends on.
- key: model_operations
  name: Model operations
  workstream_type: technology
  objective: Own the model operations work this programme depends on.
- key: skills_and_adoption
  name: Skills and adoption
  workstream_type: organisation_skills
  objective: Own the skills and adoption work this programme depends on.
- key: programme_office
  name: Programme office
  workstream_type: other
  objective: 'Run the programme: business case, governance and the deliverables no single workstream owns.'
stages:
  frame:
    gate: Business case approved
    deliverables:
    - code: data_ai.frame.business_case_and_value_drivers
      name: Business case and value drivers
      adm_phase: A
      workstream: programme_office
      element_types:
      - Driver
      - Goal
      - Assessment
      purpose: State why this programme is needed and how success will be judged.
  discover:
    gate: Current state understood
    deliverables:
    - code: data_ai.discover.current_state_and_requirements
      name: Current state and requirements
      adm_phase: B
      workstream: data_platform
      element_types:
      - Requirement
      - Capability
      purpose: Capture what exists today and what the programme must satisfy.
  shape:
    gate: Target design agreed
    deliverables:
    - code: data_ai.shape.target_design_and_delivery_plan
      name: Target design and delivery plan
      adm_phase: D
      workstream: data_platform
      element_types:
      - WorkPackage
      - Plateau
      purpose: Describe the target state and the work packages that will reach it.
  decide:
    gate: Governance sign-off
    deliverables:
    - code: data_ai.decide.decision_readiness
      name: Decision readiness
      adm_phase: E
      workstream: programme_office
      element_types:
      - Requirement
      - Assessment
      purpose: Confirm the chosen option is ready for governance sign-off.
  deliver:
    gate: Change landed
    deliverables:
    - code: data_ai.deliver.delivery_and_cutover
      name: Delivery and cutover
      adm_phase: F
      workstream: data_platform
      element_types:
      - WorkPackage
      - ImplementationEvent
      purpose: Deliver the change and confirm it has landed.
