schema_version: 1
key: esg_reporting
name: ESG and sustainability reporting
summary: Put governed data and controls behind the organisation's sustainability disclosures.
vendor_specific: false
arb_required_at_decide: false
workstreams:
- key: materiality_and_metrics
  name: Materiality and metrics
  workstream_type: policy_control
  objective: Own the materiality and metrics work this programme depends on.
- key: data_collection_and_quality
  name: Data collection and quality
  workstream_type: data
  objective: Own the data collection and quality work this programme depends on.
- key: controls_and_assurance
  name: Controls and assurance
  workstream_type: policy_control
  objective: Own the controls and assurance work this programme depends on.
- key: supplier_and_value_chain_data
  name: Supplier and value-chain data
  workstream_type: supplier
  objective: Own the supplier and value-chain data work this programme depends on.
- key: reporting_and_disclosure
  name: Reporting and disclosure
  workstream_type: process
  objective: Own the reporting and disclosure work this programme depends on.
- key: decarbonisation_actions
  name: Decarbonisation actions
  workstream_type: other
  objective: Own the decarbonisation actions work this programme depends on.
- key: programme_office
  name: Programme office
  workstream_type: other
  objective: 'Run the programme: business case, governance and the deliverables no single workstream owns.'
stages:
  frame:
    gate: Business case approved
    deliverables:
    - code: esg_reporting.frame.business_case_and_value_drivers
      name: Business case and value drivers
      adm_phase: A
      workstream: programme_office
      element_types:
      - Driver
      - Goal
      - Assessment
      purpose: State why this programme is needed and how success will be judged.
  discover:
    gate: Current state understood
    deliverables:
    - code: esg_reporting.discover.current_state_and_requirements
      name: Current state and requirements
      adm_phase: B
      workstream: materiality_and_metrics
      element_types:
      - Requirement
      - Capability
      purpose: Capture what exists today and what the programme must satisfy.
  shape:
    gate: Target design agreed
    deliverables:
    - code: esg_reporting.shape.target_design_and_delivery_plan
      name: Target design and delivery plan
      adm_phase: D
      workstream: materiality_and_metrics
      element_types:
      - WorkPackage
      - Plateau
      purpose: Describe the target state and the work packages that will reach it.
  decide:
    gate: Governance sign-off
    deliverables:
    - code: esg_reporting.decide.decision_readiness
      name: Decision readiness
      adm_phase: E
      workstream: programme_office
      element_types:
      - Requirement
      - Assessment
      purpose: Confirm the chosen option is ready for governance sign-off.
  deliver:
    gate: Change landed
    deliverables:
    - code: esg_reporting.deliver.delivery_and_cutover
      name: Delivery and cutover
      adm_phase: F
      workstream: materiality_and_metrics
      element_types:
      - WorkPackage
      - ImplementationEvent
      purpose: Deliver the change and confirm it has landed.
