schema_version: 1
key: platform_replacement
name: Platform replacement
summary: Retire a core administrative platform and replace it with a new one, migrating process and data
  across.
vendor_specific: false
arb_required_at_decide: false
workstreams:
- key: core_hr
  name: Core HR
  workstream_type: process
  objective: Own the core hr work this programme depends on.
- key: payroll
  name: Payroll
  workstream_type: process
  objective: Own the payroll work this programme depends on.
- key: recruiting_and_onboarding
  name: Recruiting and onboarding
  workstream_type: process
  objective: Own the recruiting and onboarding work this programme depends on.
- key: integrations
  name: Integrations
  workstream_type: technology
  objective: Own the integrations work this programme depends on.
- key: data_migration
  name: Data migration
  workstream_type: data
  objective: Own the data migration work this programme depends on.
- key: change_and_training
  name: Change and training
  workstream_type: organisation_skills
  objective: Own the change and training work this programme depends on.
- key: programme_office
  name: Programme office
  workstream_type: other
  objective: 'Run the programme: business case, governance and the deliverables no single workstream owns.'
stages:
  frame:
    gate: Business case approved
    deliverables:
    - code: platform_replacement.frame.business_case_and_value_drivers
      name: Business case and value drivers
      adm_phase: A
      workstream: programme_office
      element_types:
      - Driver
      - Goal
      - Assessment
      purpose: State why this programme is needed and how success will be judged.
  discover:
    gate: Current state understood
    deliverables:
    - code: platform_replacement.discover.current_state_and_requirements
      name: Current state and requirements
      adm_phase: B
      workstream: core_hr
      element_types:
      - Requirement
      - Capability
      purpose: Capture what exists today and what the programme must satisfy.
  shape:
    gate: Target design agreed
    deliverables:
    - code: platform_replacement.shape.target_design_and_delivery_plan
      name: Target design and delivery plan
      adm_phase: D
      workstream: core_hr
      element_types:
      - WorkPackage
      - Plateau
      purpose: Describe the target state and the work packages that will reach it.
  decide:
    gate: Governance sign-off
    deliverables:
    - code: platform_replacement.decide.decision_readiness
      name: Decision readiness
      adm_phase: E
      workstream: programme_office
      element_types:
      - Requirement
      - Assessment
      purpose: Confirm the chosen option is ready for governance sign-off.
  deliver:
    gate: Change landed
    deliverables:
    - code: platform_replacement.deliver.delivery_and_cutover
      name: Delivery and cutover
      adm_phase: F
      workstream: core_hr
      element_types:
      - WorkPackage
      - ImplementationEvent
      purpose: Deliver the change and confirm it has landed.
