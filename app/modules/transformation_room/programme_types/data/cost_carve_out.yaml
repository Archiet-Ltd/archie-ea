schema_version: 1
key: cost_carve_out
name: Cost and carve-out
summary: Separate a business unit's applications, data and shared services from the parent so it can operate,
  or be divested, on its own.
vendor_specific: false
arb_required_at_decide: false
workstreams:
- key: perimeter_and_legal_entities
  name: Perimeter and legal entities
  workstream_type: other
  objective: Own the perimeter and legal entities work this programme depends on.
- key: applications_and_data_separation
  name: Applications and data separation
  workstream_type: application_rationalisation
  objective: Own the applications and data separation work this programme depends on.
- key: shared_services_and_tsas
  name: Shared services and TSAs
  workstream_type: supplier
  objective: Own the shared services and tsas work this programme depends on.
- key: people_and_organisation
  name: People and organisation
  workstream_type: organisation_skills
  objective: Own the people and organisation work this programme depends on.
- key: finance_and_reporting
  name: Finance and reporting
  workstream_type: process
  objective: Own the finance and reporting work this programme depends on.
- key: stranded_cost
  name: Stranded cost
  workstream_type: other
  objective: Own the stranded cost work this programme depends on.
- key: programme_office
  name: Programme office
  workstream_type: other
  objective: 'Run the programme: business case, governance and the deliverables no single workstream owns.'
stages:
  frame:
    gate: Business case approved
    deliverables:
    - code: cost_carve_out.frame.business_case_and_value_drivers
      name: Business case and value drivers
      adm_phase: A
      workstream: programme_office
      element_types:
      - Driver
      - Goal
      - Assessment
      purpose: State why this programme is needed and how success will be judged.
  discover:
    gate: Current state understood
    deliverables:
    - code: cost_carve_out.discover.current_state_and_requirements
      name: Current state and requirements
      adm_phase: B
      workstream: perimeter_and_legal_entities
      element_types:
      - Requirement
      - Capability
      purpose: Capture what exists today and what the programme must satisfy.
  shape:
    gate: Target design agreed
    deliverables:
    - code: cost_carve_out.shape.target_design_and_delivery_plan
      name: Target design and delivery plan
      adm_phase: D
      workstream: perimeter_and_legal_entities
      element_types:
      - WorkPackage
      - Plateau
      purpose: Describe the target state and the work packages that will reach it.
  decide:
    gate: Governance sign-off
    deliverables:
    - code: cost_carve_out.decide.decision_readiness
      name: Decision readiness
      adm_phase: E
      workstream: programme_office
      element_types:
      - Requirement
      - Assessment
      purpose: Confirm the chosen option is ready for governance sign-off.
  deliver:
    gate: Change landed
    deliverables:
    - code: cost_carve_out.deliver.delivery_and_cutover
      name: Delivery and cutover
      adm_phase: F
      workstream: perimeter_and_legal_entities
      element_types:
      - WorkPackage
      - ImplementationEvent
      purpose: Deliver the change and confirm it has landed.
