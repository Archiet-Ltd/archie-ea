schema_version: 1
key: regulatory
name: Regulatory compliance
summary: Bring architecture, controls and evidence up to a named regulatory standard.
vendor_specific: false
arb_required_at_decide: true
workstreams:
- key: ict_risk_management
  name: ICT risk management
  workstream_type: policy_control
  objective: Own the ict risk management work this programme depends on.
- key: incident_reporting
  name: Incident reporting
  workstream_type: process
  objective: Own the incident reporting work this programme depends on.
- key: resilience_testing
  name: Resilience testing
  workstream_type: technology
  objective: Own the resilience testing work this programme depends on.
- key: third_party_risk
  name: Third-party risk
  workstream_type: supplier
  objective: Own the third-party risk work this programme depends on.
- key: evidence_and_audit
  name: Evidence and audit
  workstream_type: policy_control
  objective: Own the evidence and audit work this programme depends on.
- key: programme_office
  name: Programme office
  workstream_type: other
  objective: 'Run the programme: business case, governance and the deliverables no single workstream owns.'
stages:
  frame:
    gate: Business case approved
    deliverables:
    - code: regulatory.frame.business_case_and_value_drivers
      name: Business case and value drivers
      adm_phase: A
      workstream: programme_office
      element_types:
      - Driver
      - Goal
      - Assessment
      purpose: State why this programme is needed and how success will be judged.
  discover:
    gate: Current state understood
    deliverables:
    - code: regulatory.discover.current_state_and_requirements
      name: Current state and requirements
      adm_phase: B
      workstream: ict_risk_management
      element_types:
      - Requirement
      - Capability
      purpose: Capture what exists today and what the programme must satisfy.
  shape:
    gate: Target design agreed
    deliverables:
    - code: regulatory.shape.target_design_and_delivery_plan
      name: Target design and delivery plan
      adm_phase: D
      workstream: ict_risk_management
      element_types:
      - WorkPackage
      - Plateau
      purpose: Describe the target state and the work packages that will reach it.
  decide:
    gate: Governance sign-off
    deliverables:
    - code: regulatory.decide.decision_readiness
      name: Decision readiness
      adm_phase: E
      workstream: programme_office
      element_types:
      - Requirement
      - Assessment
      purpose: Confirm the chosen option is ready for governance sign-off.
  deliver:
    gate: Change landed
    deliverables:
    - code: regulatory.deliver.delivery_and_cutover
      name: Delivery and cutover
      adm_phase: F
      workstream: ict_risk_management
      element_types:
      - WorkPackage
      - ImplementationEvent
      purpose: Deliver the change and confirm it has landed.
