schema_version: 1
key: cloud_migration
name: Cloud migration
summary: Move applications and data off owned data centres and onto a cloud landing zone.
vendor_specific: false
arb_required_at_decide: false
workstreams:
- key: landing_zone
  name: Landing zone
  workstream_type: technology
  objective: Own the landing zone work this programme depends on.
- key: application_migration
  name: Application migration
  workstream_type: application_rationalisation
  objective: Own the application migration work this programme depends on.
- key: data_and_storage
  name: Data and storage
  workstream_type: data
  objective: Own the data and storage work this programme depends on.
- key: networking_and_security
  name: Networking and security
  workstream_type: technology
  objective: Own the networking and security work this programme depends on.
- key: operations_and_finops
  name: Operations and FinOps
  workstream_type: process
  objective: Own the operations and finops work this programme depends on.
- key: programme_office
  name: Programme office
  workstream_type: other
  objective: 'Run the programme: business case, governance and the deliverables no single workstream owns.'
stages:
  frame:
    gate: Business case approved
    deliverables:
    - code: cloud_migration.frame.business_case_and_value_drivers
      name: Business case and value drivers
      adm_phase: A
      workstream: programme_office
      element_types:
      - Driver
      - Goal
      - Assessment
      purpose: State why this programme is needed and how success will be judged.
  discover:
    gate: Current state understood
    deliverables:
    - code: cloud_migration.discover.current_state_and_requirements
      name: Current state and requirements
      adm_phase: B
      workstream: landing_zone
      element_types:
      - Requirement
      - Capability
      purpose: Capture what exists today and what the programme must satisfy.
  shape:
    gate: Target design agreed
    deliverables:
    - code: cloud_migration.shape.target_design_and_delivery_plan
      name: Target design and delivery plan
      adm_phase: D
      workstream: landing_zone
      element_types:
      - WorkPackage
      - Plateau
      purpose: Describe the target state and the work packages that will reach it.
  decide:
    gate: Governance sign-off
    deliverables:
    - code: cloud_migration.decide.decision_readiness
      name: Decision readiness
      adm_phase: E
      workstream: programme_office
      element_types:
      - Requirement
      - Assessment
      purpose: Confirm the chosen option is ready for governance sign-off.
  deliver:
    gate: Change landed
    deliverables:
    - code: cloud_migration.deliver.delivery_and_cutover
      name: Delivery and cutover
      adm_phase: F
      workstream: landing_zone
      element_types:
      - WorkPackage
      - ImplementationEvent
      purpose: Deliver the change and confirm it has landed.
