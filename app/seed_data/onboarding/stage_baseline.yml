# Stage-baseline content for onboarding's "Fill the gaps" step.
#
# Each stage lists what is *expected* to exist for a company at that stage —
# never asserted as fact, only compared against what the organisation has
# actually recorded. Stages are additive: "early_revenue" inherits everything
# in "pre_revenue", "growing" inherits "early_revenue", and so on.
#
# Editable without a schema or code change — this is template data, not a
# hardcoded branch in application code.

pre_revenue:
  roles:
    - founder_ceo
    - product_eng_lead
  functions:
    - build_product
    - find_first_customers
    - manage_cash
  capabilities:
    - software_development
    - customer_discovery
  systems:
    - code_repository
    - team_comms_tool
  controls: []

early_revenue:
  roles:
    - first_sales_owner
    - marketing_owner
    - support_cs_owner
  functions:
    - sell
    - market
    - support_customers
    - invoice_and_collect
    - baseline_data_protection
  capabilities:
    - lead_generation
    - customer_onboarding
    - release_management
    - bookkeeping
  systems:
    - billing_invoicing_tool
    - support_channel
    - basic_crm_or_spreadsheet
  controls:
    # conditional: only expected when the named trigger applies
    - key: gdpr_data_protection
      condition: region_europe_or_eu_customers
    - key: payment_security
      condition: handles_card_data_directly

growing:
  roles:
    - head_of_sales
    - marketing_lead
    - cs_lead
    - finance_lead
    - people_lead
    - named_security_owner
  functions:
    - pipeline_management
    - campaign_management
    - renewals
    - structured_hiring
    - payroll
    - incident_response
    - vendor_management
  capabilities:
    - forecasting
    - qa_testing
    - security_operations
    - hr_compliance
  systems:
    - real_crm
    - ats_hiring_tracker
    - ticketing_incident_tool
  controls:
    - key: access_control_policy
      condition: always
    - key: vendor_security_review
      condition: always

established:
  roles:
    - regional_or_product_line_leadership
    - internal_audit_or_risk_function
    - procurement_owner
    - data_governance_owner
  functions:
    - multi_region_compliance_tracking
    - formal_risk_and_audit_cycles
    - structured_procurement
    - data_governance
  capabilities:
    - portfolio_level_forecasting
    - formal_change_management
    - business_continuity_planning
  systems:
    - grc_or_audit_tracking_tool
    - formal_procurement_system
  controls:
    - key: region_industry_recommended_controls
      condition: always
      target_maturity: fully_implemented

