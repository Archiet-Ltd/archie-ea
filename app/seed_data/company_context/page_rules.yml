      - kepler
  - name: Ferrous Kiosk
    aliases:
      - ferrous kiosk
      - ferrous
  - name: Sable Messaging
    aliases:
      - sable messaging
      - sable
  - name: Apricot Works
    aliases:
      - apricot works
      - apricot
  - name: Elderberry Labs
    aliases:
      - elderberry labs
