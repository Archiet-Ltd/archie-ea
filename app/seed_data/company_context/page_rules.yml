# Page reading rules for the company-context intake (static data, schema-tested).
#
# Every scalar below is a plain string, list or number. No tenant value, no
# customer, employer or prospect name, no owner, cost, contract, maturity,
# headcount, salary or person key anywhere in this file. The fetched pages
# are classified against `purposes` in the order listed; `intake_zones` is the
# page-class table of the model-call record copied row for row.

two_part_suffixes:
  - co.uk
  - org.uk
  - ac.uk
  - gov.uk
  - com.au
  - net.au
  - org.au
  - co.nz
  - co.jp
  - co.kr
  - co.in
  - co.za
  - co.il
  - co.id
  - com.br
  - com.mx
  - com.ar
  - com.sg
  - com.hk
  - com.tr

# Fetch order (FR-CX-2). max_pages caps what the fetcher requests per purpose.
purposes:
  - key: home
    path_patterns: ["^/?(?:index\\.html)?$"]
    link_text_patterns: [home]
    conventional_paths: ["/"]
    max_pages: 1
  - key: about
    path_patterns: ["^/?(?:about|company|mission|team)(?:/|$)"]
    link_text_patterns: [about, company, mission, who we are, what we do]
    conventional_paths: ["/about"]
    max_pages: 1
  - key: product
    path_patterns: ["^/?(?:product|platform|features|solutions)(?:/|$)"]
    link_text_patterns: [product, platform, features, solutions]
    conventional_paths: ["/product", "/features"]
    max_pages: 3
  - key: pricing
    path_patterns: ["^/?(?:pricing|plans|rates)(?:/|$)"]
    link_text_patterns: [pricing, plans, rates]
    conventional_paths: ["/pricing"]
    max_pages: 1
  - key: customers
    path_patterns: ["^/?(?:customers|case-studies|case studies|industries|clients)(?:/|$)"]
    link_text_patterns: [customers, case studies, case-studies, industries, clients]
    conventional_paths: ["/customers"]
    max_pages: 2
  - key: partners
    path_patterns: ["^/?(?:partners|integrations|marketplace|ecosystem)(?:/|$)"]
    link_text_patterns: [partners, integrations, marketplace, ecosystem, partner]
    conventional_paths: ["/partners"]
    max_pages: 2
  - key: careers
    path_patterns: ["^/?(?:careers|jobs|openings|join-us|join us)(?:/|$)"]
    link_text_patterns: [careers, jobs, openings, join us, join-us, we are hiring, we're hiring]
    conventional_paths: ["/careers"]
    max_pages: 11
  - key: engineering
    path_patterns: ["^/?(?:engineering|blog|insights|news|tech)(?:/|$)"]
    link_text_patterns: [engineering, blog, insights, news, technology]
    conventional_paths: ["/engineering", "/blog"]
    max_pages: 4
  - key: documentation
    path_patterns: ["^/?(?:docs|documentation|guides|help-center|developer)(?:/|$)"]
    link_text_patterns: [docs, documentation, guides, help center, help-center, developers, developer]
    conventional_paths: ["/docs"]
    max_pages: 2
  - key: security
    path_patterns: ["^/?(?:security|trust|compliance)(?:/|$)"]
    link_text_patterns: [security, trust, compliance]
    conventional_paths: ["/security"]
    max_pages: 1
  - key: privacy
    path_patterns: ["^/?(?:privacy|privacy-policy|data-protection|datenschutz)(?:/|$)"]
    link_text_patterns: [privacy, privacy policy, privacy-policy, data protection, data-protection]
    conventional_paths: ["/privacy"]
    max_pages: 2
  - key: comparison
    path_patterns: ["^(?=/)"]
    link_text_patterns: [vs, versus, alternative, compare, comparison, switch from, switch-from, migrate from, migrate-from]
    conventional_paths: []
    max_pages: 3
  - key: support
    path_patterns: ["^/?(?:support|help|faq|contact)(?:/|$)"]
    link_text_patterns: [support, help, faq, contact]
    conventional_paths: ["/support"]
    max_pages: 1
  - key: strategy
    path_patterns: ["^/?(?:strategy|investors|investor-relations|annual-report|mission)(?:/|$)"]
    link_text_patterns: [strategy, investors, investor relations, investor-relations, annual report, annual-report]
    conventional_paths: ["/strategy", "/investors"]
    max_pages: 2

# Pages never fetched for reading (FR-CX-2): they sit on the excluded list or
# carry no reading value. The fetcher never requests a path below.
excluded_paths:
  - team
  - people
  - leadership
  - staff
  - board
  - authors
  - login
  - app
  - account
  - cart
  - search
  - calendar

# Query strings are not part of a page identity: a URL with a query is never
# fetched as its own page.
excluded_query_strings: true

