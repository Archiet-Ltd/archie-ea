# The page-class table of the model-call record (D-18) copied row for row for
# the eleven page classes sent to the model. Each purpose names the calls it
# gets (A, B or both) and the boxes allowed in that call's zone table, each
# box with the element type and profile of its FR-CX-11 row.
intake_zones:
  - purpose: home
    calls: [A, B]
    boxes:
      - box_key: customer_segment
        element_type: Stakeholder
        profile: customer_segment
      - box_key: problem
        element_type: Driver
        profile: problem
      - box_key: value_proposition
        element_type: Value
        profile: value_proposition
      - box_key: channel
        element_type: BusinessInterface
        profile: channel
      - box_key: key_metric
        element_type: Outcome
        profile: key_metric
      - box_key: market_driver
        element_type: Driver
        profile: market_driver
  - purpose: about
    calls: [A, B]
    boxes:
      - box_key: key_metric
        element_type: Outcome
        profile: key_metric
      - box_key: objective
        element_type: Goal
        profile: objective
      - box_key: market_driver
        element_type: Driver
        profile: market_driver
      - box_key: reason
        element_type: Driver
        profile: reason
  - purpose: product
    calls: [A]
    boxes:
      - box_key: customer_segment
        element_type: Stakeholder
        profile: customer_segment
      - box_key: problem
        element_type: Driver
        profile: problem
      - box_key: value_proposition
        element_type: Value
        profile: value_proposition
      - box_key: solution_feature
        element_type: Requirement
        profile: solution_feature
  - purpose: pricing
    calls: [A]
    boxes:
      - box_key: customer_segment
        element_type: Stakeholder
        profile: customer_segment
      - box_key: channel
        element_type: BusinessInterface
        profile: channel
      - box_key: revenue_model
        element_type: Value
        profile: value_proposition
  - purpose: customers
    calls: [A]
    boxes:
      - box_key: customer_segment
        element_type: Stakeholder
        profile: customer_segment
      - box_key: customer_relationship
        element_type: BusinessService
        profile: customer_relationship
      - box_key: key_metric
        element_type: Outcome
        profile: key_metric
  - purpose: partners
    calls: [A]
    boxes:
      - box_key: channel
        element_type: BusinessInterface
        profile: channel
      - box_key: key_partner
        element_type: BusinessActor
        profile: key_partner
  - purpose: support
    calls: [A]
    boxes:
      - box_key: customer_relationship
        element_type: BusinessService
        profile: customer_relationship
  - purpose: documentation
    calls: [A]
    boxes:
      - box_key: solution_feature
        element_type: Requirement
        profile: solution_feature
  - purpose: comparison
    calls: [B]
    boxes:
      - box_key: existing_alternative
        element_type: Assessment
        profile: existing_alternative
  - purpose: strategy
    calls: [B]
    boxes:
      - box_key: objective
        element_type: Goal
        profile: objective
      - box_key: reason
        element_type: Driver
        profile: reason
      - box_key: market_driver
        element_type: Driver
        profile: market_driver
  - purpose: engineering
    calls: [B]
    boxes:
      - box_key: market_driver
        element_type: Driver
        profile: market_driver

# Purposes and page kinds that are fetched but never sent to the model: they
# feed the deterministic rules only.
never_sent:
  - careers
  - security
  - privacy
  - documentation_integrations
  - engineering_index

pages_to_model_max: 12