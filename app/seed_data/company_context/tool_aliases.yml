# Tool aliases and the connector ladder for the company-context intake.
#
# One entry per tool. rung is one of byo_feed | unified_ticketing | native;
# native is claimed only for a tool whose connector type exists in the product
# (servicenow, jira, m365, devops). pack_key is the published pack key, or the
# character ``-`` when no pack exists. status_page_hosts and marketplace_hosts
# are the hosts a mention of that tool points at; the rules never fetch them.
# Vendor and tool names appear only as names; no customer, employer, prospect
# name, owner, cost, contract, maturity, headcount, salary or person exists
# anywhere in this file.

tools:
  - tool: ServiceNow
    aliases: [servicenow, now platform]
    category: ticketing
    rung: native
    pack_key: servicenow
    status_page_hosts: []
    marketplace_hosts: [store.servicenow.com]
  - tool: Jira
    aliases: [jira, atlassian jira, jira cloud]
    category: ticketing
    rung: native
    pack_key: jira
    status_page_hosts: []
    marketplace_hosts: [marketplace.atlassian.com, apps.atlassian.com]
  - tool: Jira Service Management
    aliases: [jira service management, jsm, jira sm]
    category: ticketing
    rung: byo_feed
    pack_key: jira
    status_page_hosts: []
    marketplace_hosts: [marketplace.atlassian.com, apps.atlassian.com]
