{# shadcn/ui Input Component #}
{# aria_label: pass when the call site has no visible <label for="<id>">.
   A placeholder is not a label -- it is gone as soon as the user types.
   attrs_dict: extra attributes as a dict (x-model, @input, :id ...); values are escaped.
   size: default (h-10), sm (h-9) or xs (h-8). #}
{% macro input(
    id='',
    name='',
    type='text',
    placeholder='',
    value='',
    disabled=false,
    required=false,
    class='',
    error=none,
    aria_describedby=none,
    aria_label=none,
    size='default',
    attrs_dict={}
) %}
    {% set heights = {'default': 'h-10', 'sm': 'h-9', 'xs': 'h-8'} %}
    <input
        {% if id %}id="{{ id }}"{% endif %}
        {% if name %}name="{{ name }}"{% endif %}
        type="{{ type }}"
        {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
        {% if value %}value="{{ value }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        {% if required %}required aria-required="true"{% endif %}
        {% if error %}aria-invalid="true"{% endif %}
        {% if aria_describedby %}aria-describedby="{{ aria_describedby }}"{% elif error and id %}aria-describedby="{{ id }}-error"{% endif %}
        {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
        {{ attrs_dict|xmlattr }}
        class="flex {{ heights.get(size, 'h-10') }} w-full rounded-md border {% if error %}border-destructive{% else %}border-input{% endif %} bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
    />
    {% if error and id %}
    <p id="{{ id }}-error" class="text-sm text-destructive-emphasis mt-1" role="alert">{{ error }}</p>
    {% endif %}
{% endmacro %}

{% macro label(for='', required=false, class='') %}
    <label {% if for %}for="{{ for }}"{% endif %} class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70 {{ class }}">
        {{ caller() }}{% if required %}<span class="text-destructive-emphasis ml-1">*</span>{% endif %}
    </label>
{% endmacro %}

{# aria_label: pass when the call site has no visible <label for="<id>">.
   A placeholder is not a label -- it is gone as soon as the user types. #}
{% macro textarea(
    id='',
    name='',
    placeholder='',
    rows=3,
    disabled=false,
    required=false,
    class='',
    error=none,
    aria_describedby=none,
    aria_label=none,
    attrs_dict={}
) %}
    <textarea
        {% if id %}id="{{ id }}"{% endif %}
        {% if name %}name="{{ name }}"{% endif %}
        {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}
        {% if disabled %}disabled{% endif %}
        {% if required %}required aria-required="true"{% endif %}
        {% if error %}aria-invalid="true"{% endif %}
        {% if aria_describedby %}aria-describedby="{{ aria_describedby }}"{% elif error and id %}aria-describedby="{{ id }}-error"{% endif %}
        {% if aria_label %}aria-label="{{ aria_label }}"{% endif %}
        rows="{{ rows }}"
        {{ attrs_dict|xmlattr }}
        class="flex min-h-[80px] w-full rounded-md border {% if error %}border-destructive{% else %}border-input{% endif %} bg-background px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
    >{{ caller() if caller }}</textarea>
    {% if error and id %}
    <p id="{{ id }}-error" class="text-sm text-destructive-emphasis mt-1" role="alert">{{ error }}</p>
    {% endif %}
{% endmacro %}
