   context variable. Import it `with context` or the CspNonceExtension will
   render nonce="" and the CSP will refuse the script:
       {% from 'macros/page_macros.html' import render_inline_editor with context %}
   Enforced by scripts/check_macro_import_context.py. #}
{# Page macros with shadcn Button components #}

{% macro render_inline_editor(editable_html_obj, current_user) %}
    <div id="editor-{{ editable_html_obj.editor_name }}" contenteditable="false" class="prose prose-sm max-w-none mb-6">
        {{ editable_html_obj.value|sanitize_html }}
    </div>

    {% if current_user.is_admin() %}
       <div class="flex gap-2" x-data="{ editing: false }">
           <button type="button" 
               @click="editing = true"
               x-show="!editing" x-cloak
               class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md border border-input bg-background text-sm font-medium text-foreground transition-colors hover:bg-slate-50 dark:hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50 h-9 px-4 items-center justify-center whitespace-nowrap" aria-label="Edit">
               <i data-lucide="edit-2" class="mr-2 h-4 w-4"></i>
               Edit
           </button>
           <button type="button" 
               @click="editing = false"
               x-show="editing" x-cloak class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary text-primary-foreground text-sm font-semibold transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-9 px-4 items-center justify-center whitespace-nowrap hidden" aria-label="Edit">
               <i data-lucide="save" class="mr-2 h-4 w-4"></i>
               Save
           </button>
       </div>
    {% endif %}

    <script>
    const editorIDName = "editor-{{ editable_html_obj.editor_name }}";
    document.addEventListener('DOMContentLoaded', function() {
        {% if current_user.is_admin() %}
            const startEditBtn = document.querySelector(".start-edit");
            const endEditBtn = document.querySelector(".end-edit");
            const editorElement = document.getElementById(editorIDName);
            
            startEditBtn.addEventListener('click', function() {
                CKEDITOR.disableAutoInline = true;
                const editor = CKEDITOR.inline(editorIDName, {
                    startupFocus: true,
                    autoGrow_onStartup: true
                });
                editorElement.setAttribute("contenteditable", "true");
            });

            endEditBtn.addEventListener('click', async function() {
                if (CKEDITOR.instances[editorIDName]) {
                    const editorData = CKEDITOR.instances[editorIDName].getData();
                    
                    // Send POST request with Platform.fetch
                    try {
                        await Platform.fetch.post("{{ url_for('admin.update_editor_contents') }}", {
                            editor_name: "{{ editable_html_obj.editor_name }}",
                            edit_data: editorData
                        }, { silent: true });
                        Platform.toast.success('Saved.');
                    } catch (error) {
                        Platform.toast.error('Failed to save changes: ' + (error.message || 'Unknown error'));
                    }
                    
                    CKEDITOR.instances[editorIDName].destroy();
                }
                editorElement.setAttribute("contenteditable", "false");
            });
            
            // Initialize Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        {% endif %}
    });
    </script>

{% endmacro %}
