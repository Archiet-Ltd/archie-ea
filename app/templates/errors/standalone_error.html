<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ error_title }}</title>
    <script>
        (function() {
            var stored = null;
            try { stored = localStorage.getItem('theme'); } catch (e) {}
            if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shadcn_tokens.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: hsl(var(--background)); color: hsl(var(--foreground));
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .wrap { width: 100%; max-width: 32rem; text-align: center; }
        .icon-wrap {
            width: 5rem; height: 5rem; margin: 0 auto 1.5rem;
            display: flex; align-items: center; justify-content: center;
            border-radius: 9999px; background: hsl(var(--muted));
        }
        .icon { width: 2.5rem; height: 2.5rem; color: hsl(var(--muted-foreground)); }
        .code {
            margin: 0 0 0.5rem; font-size: clamp(4.5rem, 14vw, 6rem);
            line-height: 1; font-weight: 800; letter-spacing: -0.04em;
        }
        .title { margin: 0 0 0.75rem; font-size: 1.5rem; line-height: 1.25; font-weight: 600; }
        .copy { margin: 0 0 2rem; color: hsl(var(--muted-foreground)); line-height: 1.7; }
        .actions { display: flex; flex-direction: column; gap: 0.75rem; justify-content: center; }
        .button {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            border-radius: 0.375rem; border: 1px solid transparent;
            padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500;
            text-decoration: none; cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }
        .button:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
        .button-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
        .button-primary:hover { opacity: 0.9; }
        .button-secondary { border-color: hsl(var(--input)); background: hsl(var(--background)); color: hsl(var(--foreground)); }
        .button-secondary:hover { background: hsl(var(--accent)); }
        .button-icon { width: 1rem; height: 1rem; flex: 0 0 auto; }
        @media (min-width: 640px) { .actions { flex-direction: row; } }
    </style>
</head>
<body>
    <main id="main-content">
        <div class="wrap">
            <div class="icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    {{ error_icon_paths|safe }}
                </svg>
            </div>

            <h1 class="title" data-status="{{ error_status }}">{{ error_title }}</h1>

            <p class="copy">{{ error_message }}</p>

            <div class="actions">
                <a href="/dashboard/overview" class="button button-primary">
                    <svg viewBox="0 0 24 24" class="button-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m3 9 9-7 9 7"></path><path d="M9 22V12h6v10"></path>
                    </svg>
                    Go to the dashboard
                </a>
                <a href="/status" class="button button-secondary">Service status</a>
            </div>
        </div>
    </main>
</body>
</html>
