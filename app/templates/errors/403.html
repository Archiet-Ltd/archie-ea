<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No access</title>
    <script nonce="{{ csp_nonce }}">(function(){var s=localStorage.getItem('theme');if(s==='dark'||(!s&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}})();</script>
    <link rel="stylesheet" href="{{ 'css/shadcn_tokens.css' | asset_url }}">
    <style nonce="{{ csp_nonce }}">
        *{box-sizing:border-box} body{margin:0;min-height:100vh;background:hsl(var(--background));color:hsl(var(--foreground));font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
        main{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:1rem}
        .wrap{width:100%;max-width:32rem;text-align:center}
        .icon-wrap{width:5rem;height:5rem;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;border-radius:9999px;background:hsl(var(--destructive) / .1)}
        .icon{width:2.5rem;height:2.5rem;color:hsl(var(--destructive))}
        .code{margin:0 0 .5rem;font-size:clamp(4.5rem,14vw,6rem);line-height:1;font-weight:800;letter-spacing:-.04em}
        .title{margin:0 0 .75rem;font-size:1.5rem;line-height:1.25;font-weight:600} .copy{margin:0 0 2rem;color:hsl(var(--muted-foreground));line-height:1.7}
        .actions{display:flex;flex-direction:column;gap:.75rem;justify-content:center}
        .button{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.375rem;border:1px solid transparent;padding:.625rem 1.25rem;font-size:.875rem;font-weight:500;text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
        .button:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px} .button-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))} .button-primary:hover{opacity:.9}
        .button-secondary{border-color:hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground))} .button-secondary:hover{background:hsl(var(--accent))}
        .button-icon{width:1rem;height:1rem;flex:0 0 auto} @media(min-width:640px){.actions{flex-direction:row}}
    </style>
</head>
<body>
    <main>
        <div class="wrap">
            <div class="icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
                    <path d="m9.5 12.5 2 2 4-4"></path>
                </svg>
            </div>
            <h1 class="code">403</h1>
            <h2 class="title">{{ error_title|default('You do not have access to this page') }}</h2>
            <p class="copy">{{ error_message|default('Your role does not include this page. Ask an administrator of your organisation to give you access.') }}</p>
            {% if not blocked %}
            <div class="actions">
                <a href="/" class="button button-primary">
                    <svg viewBox="0 0 24 24" class="button-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7"></path><path d="M9 22V12h6v10"></path></svg>
                    Go to Dashboard
                </a>
                <button id="btn-go-back-403" type="button" class="button button-secondary">
                    <svg viewBox="0 0 24 24" class="button-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                    Go Back
                </button>
            </div>
            {% endif %}
        </div>
    </main>
    {% if not blocked %}
    <script nonce="{{ csp_nonce }}">document.getElementById('btn-go-back-403').addEventListener('click', function(){ history.back(); });</script>
    {% endif %}
</body>
</html>
