{% extends 'layouts/public_base.html' %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="flex justify-center px-4 py-10">
        <div class="w-full max-w-md">
            <div class="rounded-lg border bg-card text-card-foreground shadow-sm" data-link-state="unusable">
                <div class="flex flex-col space-y-1.5 p-6">
                    <h1 class="text-2xl font-semibold leading-none tracking-tight">{{ title }}</h1>
                </div>
                <div class="p-6 pt-0 space-y-4">
                    <p class="text-sm text-muted-foreground">{{ message }}</p>
                    <a href="{{ action_href }}"
                       class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2">
                        {{ action_label }}
                    </a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
