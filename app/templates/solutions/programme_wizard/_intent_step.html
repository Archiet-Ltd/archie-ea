<section class="rounded-lg border border-border bg-card p-6" aria-labelledby="programme-heading"
         x-show="currentStep === 0" x-cloak data-testid="step-intent">
  <h2 id="programme-heading" class="text-lg font-semibold text-foreground">Programme intent</h2>
  <p class="mt-1 text-sm text-muted-foreground">Name the programme and state the business objective it exists to achieve.</p>

  <div class="mt-4 rounded-md border border-border bg-muted/30 p-4">
    <button type="button" data-testid="ai-prefill-open"
            class="inline-flex items-center gap-2 text-sm font-medium text-primary hover:underline"
            @click="aiPrefill.open = !aiPrefill.open">
      <i data-lucide="sparkles" class="h-4 w-4"></i>
      Generate with AI
    </button>
    <div x-show="aiPrefill.open" x-cloak class="mt-3 space-y-2">
      <label class="grid gap-2 text-sm font-medium text-foreground">
        Describe the programme in a few sentences
        <textarea class="min-h-20 rounded-md border border-border bg-background px-3 py-2 text-sm"
                  x-model="aiPrefill.description" data-testid="ai-prefill-description"
                  placeholder="e.g. Rationalise our 40 duplicate CRM applications down to one platform by end of 2027, cutting licence spend 30%."></textarea>
      </label>
      <button type="button" data-testid="ai-prefill-generate"
              class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md bg-primary text-primary-foreground text-sm font-semibold transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 h-9 px-4 items-center justify-center"
              :disabled="aiPrefill.loading || !aiPrefill.description.trim()"
              @click="generateProgrammePrefill()">
        <span x-text="aiPrefill.loading ? 'Generating…' : 'Generate'"></span>
      </button>
      <p class="text-xs text-muted-foreground" x-show="aiPrefill.applied" x-cloak data-testid="ai-prefill-applied">
        Fields below were pre-filled — review and edit anything before continuing.
      </p>
      <div class="rounded-md border border-destructive/30 bg-destructive/10 p-2 text-sm text-destructive-emphasis"
           x-show="aiPrefill.error" x-cloak x-text="aiPrefill.error" data-testid="ai-prefill-error"></div>
    </div>
  </div>

  <div class="mt-4 grid gap-4">
    <label class="grid gap-2 text-sm font-medium text-foreground">
      Programme name
      <input class="h-9 rounded-md border border-border bg-background px-3 text-sm"
             name="name" value="{{ programme_form.name }}"
             x-model.trim="form.name" required autocomplete="off" data-testid="field-name">
    </label>
    <label class="grid gap-2 text-sm font-medium text-foreground">
      Business objective
      <textarea class="min-h-24 rounded-md border border-border bg-background px-3 py-2 text-sm"
                name="objective" x-model.trim="form.objective"
                required data-testid="field-objective">{{ programme_form.objective }}</textarea>
    </label>
  </div>
</section>
