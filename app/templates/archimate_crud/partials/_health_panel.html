<!-- Health panel content — loaded inside slide-out -->
<div class="p-4 space-y-4" x-data="{ health: null, loading: true, error: null }" x-init="
    Platform.fetch.get('/architecture/api/health-scorecard', null, { silent: true, headers: {'X-Requested-With': 'XMLHttpRequest'} })
        .then(d => { health = d; loading = false; })
        .catch(err => { loading = false; error = err; })
">
    <div x-show="loading" class="flex items-center justify-center py-12">
        <svg class="h-5 w-5 animate-spin text-muted-foreground" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
    </div>
    <div x-show="error" class="text-center py-12 text-destructive">
        <p class="font-medium">Failed to load health data</p>
        <p class="text-sm text-muted-foreground mt-1" x-text="error.message"></p>
    </div>
    <template x-if="health && !loading">
        <div class="space-y-4">
            <div class="text-center py-4">
                <div class="text-5xl font-bold"
                     :class="health.overall_score >= 70 ? 'text-success-emphasis' : (health.overall_score >= 30 ? 'text-warning-emphasis' : 'text-destructive')"
                     x-text="Platform.figure.score(health.overall_score)"></div>
                <p class="text-sm text-muted-foreground mt-1">Repository Health Score</p>
            </div>
            {# /api/health-scorecard returns `tests` as an OBJECT keyed by test id
               (element_coverage, lifecycle_status, …), and each test carries
               pass / metric / detail — there is no `name` and no `score`.
               Iterating it as an array with :key="test.name" gave all seven rows
               the key `undefined`, which Alpine reported as "Duplicate key on
               x-for" and then died on inside its reconciler
               ("Cannot read properties of undefined (reading 'after')") — an
               uncaught error on every visit to this page, because the panel's
               x-init fetches on mount whether or not it is open. The sibling
               health_scorecard.html reads the same endpoint by key. #}
            <template x-for="[testId, test] in Object.entries(health.tests || {})" :key="testId">
                <div class="rounded-md border border-border p-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium" x-text="testId.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())"></span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-full"
                              :class="test.pass ? 'bg-success/10 text-success-emphasis' : 'bg-destructive/10 text-destructive-emphasis'"
                              x-text="test.pass ? 'PASS' : 'FAIL'"></span>
                    </div>
                    <p class="text-xs text-muted-foreground mt-1" x-text="test.detail || ''"></p>
                    {# `metric` is the measured value the endpoint actually returns.
                       The bar that used to sit here drew its width from `test.score`,
                       which this payload has never contained — so it rendered 0% for
                       every test, reading as "nothing is healthy" rather than as a
                       missing field. #}
                    <p class="text-xs font-medium text-foreground mt-1" x-text="test.metric || ''"></p>
                </div>
            </template>
        </div>
    </template>
</div>
