# Ruff configuration — pinned deliberately.
#
# The rule set is stated explicitly rather than relying on Ruff's defaults so the
# ratchet baselines in verification_baseline.json stay reproducible when Ruff is
# upgraded. Changing `select` invalidates those baselines — re-measure with
# `python scripts/verify.py --update-baseline` in the same commit.
#
# Scope is correctness, not style. F/E4/E7/E9 catch defects that actually break at
# runtime (undefined names, redefinitions, broken f-strings). Style families (UP,
# BLE, DTZ, I, RUF...) add ~30k findings on this tree and are intentionally left
# out of the gate: gating on them would mean either a multi-month cleanup or a
# blanket noqa sweep, and neither improves correctness. Run them ad hoc if you
# want the cleanup backlog.

target-version = "py312"
line-length = 100

exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "migrations/versions/_archive_pre_baseline",   # pre-baseline Alembic history; not on the chain
    "app/static",
    "node_modules",
    "code_templates",        # emitted scaffolding, not application code
]

[lint]
select = ["F", "E4", "E7", "E9"]

ignore = [
    # E711/E712 are WRONG for this codebase and must not be "fixed".
    #
    # SQLAlchemy builds SQL from operator overloading, so a filter is written
    #     .filter(FeatureFlag.parent_id == None)
    #     .filter(ElementTemplate.is_active == True)
    # and `==` is what produces `IS NULL` / `= true` in the emitted SQL. Rewriting
    # either to `is None` / `is True`, which is what these rules ask for and what
    # `ruff --fix` would do, evaluates in Python instead and yields a plain bool —
    # the predicate silently disappears from the query and the filter stops
    # filtering. That is a data-correctness bug with no visible error.
    #
    # 114 of the findings under these two rules were SQLAlchemy expressions.
    # Disabling them project-wide is the standard practice for SQLAlchemy projects
    # and is preferred here over 114 individual noqa comments.
    "E711",
    "E712",

    # E402 (module import not at top of file) is load-bearing in this codebase, not
    # a style slip. Imports sit below other module-level statements specifically to
    # break import cycles — app/models is a re-export web where several modules
    # import from each other.
    #
    # Tested rather than assumed. A conservative reordering was attempted: only the
    # region above the first def/class, only where the blocking statements were
    # simple assignments (40 of them just `logger = logging.getLogger(__name__)`),
    # skipping any file with a conditional block or a call before its imports. It
    # reordered 38 files and the application stopped booting:
    #
    #     ImportError: cannot import name 'compliance_vendor_coverage' from
    #     partially initialized module 'app.models.vendor.vendor_organization'
    #     (most likely due to a circular import)
    #
    # Reverted. E402 has no correctness value, and satisfying it here means
    # reintroducing the cycles the current ordering exists to avoid. Every other
    # rule in this ruleset is now at zero; this one is disabled deliberately.
    "E402",
]

[lint.per-file-ignores]
# Test modules legitimately import fixtures for side effects and shadow names.
"tests/*" = ["F811", "F401"]

# Package __init__ files re-export their subpackages' names so callers can write
# `from app.utils import sanitize_html`. Those imports are "unused" only within the
# __init__ itself; removing them — which is what `ruff --fix` would do — breaks
# every consumer. 54 of the F401 findings were in files of this shape.
# Star re-exports (F403/F405) belong to the same idiom as F401 here: app/models
# surfaces its submodules' names via `from .x import *` so callers can do
# `from app.models import ApplicationComponent`.
"__init__.py" = ["F401", "F403", "F405"]
"*/__init__.py" = ["F401", "F403", "F405"]

# app/models/** is a re-export web, not a set of leaf modules. models.py does
#     from .unified_capability import BusinessFunction
# to surface names other modules then import from app.models. An import that looks
# unused inside unified_capability.py is therefore load-bearing for a consumer two
# hops away, and Ruff cannot see that.
#
# This is not hypothetical: running `ruff --fix --select F401` across the tree
# removed exactly that import and the application stopped booting with
#     ImportError: cannot import name 'BusinessFunction' from app.models.unified_capability
# Verified by snapshotting registered routes and ORM tables before and after.
"app/models/*" = ["F401"]
"app/models/**/*" = ["F401"]
