version: '3.4'
services:
  database-bootstrap:
    build:
      context: .
    command: python -m scripts.database.configure_roles
    restart: "no"
    volumes:
      - './:/app'
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DATABASE_NAMES: archie,archie_test
      DATABASE_DEPLOY_PASSWORD: ${DATABASE_DEPLOY_PASSWORD}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  schema-deploy:
    build:
      context: .
    command: sh scripts/database/deploy-schema.sh
    restart: "no"
    volumes:
      - './:/app'
      # Read-only, and never application code: lets cutover-capability-tenancy
      # --apply (run from this script) see the backup the deploy just took,
      # instead of finding no marker and skipping the cutover every run (see
      # scripts/database/deploy-schema.sh and deploy/README.md). Defaults to
      # a project-local, already git-ignored directory ("backups/", .gitignore)
      # so local dev needs no configuration and simply has no marker to find;
      # set ARCHIE_BACKUP_HOST_DIR to the real backup folder in production.
      - '${ARCHIE_BACKUP_HOST_DIR:-./deploy/backups}:/var/backups/archie:ro'
    environment:
      DATABASE_URL: postgresql://archie_deploy:${DATABASE_DEPLOY_PASSWORD}@postgres:5432/archie
      DEV_DATABASE_URL: postgresql://archie_deploy:${DATABASE_DEPLOY_PASSWORD}@postgres:5432/archie
      TEST_DATABASE_URL: postgresql://archie_deploy:${DATABASE_DEPLOY_PASSWORD}@postgres:5432/archie_test
      TRANSFORMATION_COMMAND_CAPABILITY_SECRET: ${TRANSFORMATION_COMMAND_CAPABILITY_SECRET}
      TRANSFORMATION_COMMAND_CAPABILITY_PREVIOUS_SECRETS: ${TRANSFORMATION_COMMAND_CAPABILITY_PREVIOUS_SECRETS:-}
      # Matches the mount above; explicit rather than relying on the script's
      # own default staying in sync with where this mounts it.
      ARCHIE_BACKUP_MARKER: /var/backups/archie/LAST_SUCCESS
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully

  database-acl:
    build:
      context: .
    command: python -m scripts.database.configure_roles
    restart: "no"
    volumes:
      - './:/app'
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      DATABASE_NAMES: archie,archie_test
      DATABASE_DEPLOY_PASSWORD: ${DATABASE_DEPLOY_PASSWORD}
      DATABASE_RUNTIME_PASSWORD: ${DATABASE_RUNTIME_PASSWORD}
    depends_on:
      schema-deploy:
        condition: service_completed_successfully

  server:
    build:
      context: .
    # The schema is brought up by the one-shot schema-deploy service
    # (scripts/database/deploy-schema.sh) before this container starts, via
    # database-acl's depends_on chain. All steps are idempotent and non-destructive:
    #   init-db          — create any missing tables (create_all). Without it, gunicorn
    #                      boots against an empty DB and every request 500s ("relation does not exist").
    #   schema-upgrade   — apply pending Alembic revisions (migrations/versions/): the
    #                      changes reconcile-schema cannot make, such as relaxing NOT NULL
    #                      or widening a column. A failed revision stops the deploy here.
    #   reconcile-schema — drift detector: add any nullable columns the models gained since
    #                      this DB was created, listing each one it adds.
    #                      create_all never alters existing tables, so a long-lived DB drifts
    #                      and core pages 500 (e.g. arb_review_items.jira_issue_key). See
    #                      docs/known-issues/schema-drift-on-existing-databases.md
    #   backfill-principle-org — Principle gained TenantMixin; reconcile-schema adds
    #                      organization_id as NULL, and the tenant filter compares with
    #                      `=`, so NULL matches nothing. Without this every pre-existing
    #                      architecture principle silently disappears from the governance
    #                      dashboard, the ARB screens and the AI chat tools. Non-fatal:
    #                      it refuses to guess when several organisations exist.
    #   backfill-archimate-layer-casing — archimate_elements.layer accumulated two
    #                      casings and Postgres `=` is case-sensitive, so the column
    #                      partitioned itself. ArchiMateElement.layer now canonicalises
    #                      both stored values and query literals to lower case, which
    #                      means a legacy capitalised row matches NOTHING until this
    #                      has run. It is therefore required, not optional, on any
    #                      database that predates that change. Idempotent.
    #   backfill-architect-role — normalise existing users onto the architect role.
    command: gunicorn -c gunicorn.conf.py manage:app
    # Guardrails added 2026-07-30. Previously restart=no and no mem_limit, so a
    # memory spike triggered a GLOBAL OOM (22 Jul) and a wedged container stayed
    # wedged for six days (24-30 Jul). The ceiling confines a spike to this
    # container; unless-stopped brings it back by itself.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # ARCH-001 (raised 18 Aug 2026, from 2600m): the binding constraint was the
    # container's own cgroup ceiling, not host RAM. A read-only measurement on
    # the droplet showed server at 1.425GiB/2.539GiB (56%) while the HOST had
    # ~1.8GB available and a 4GB swap file barely touched (170MB used) — so
    # this was never a "buy a bigger droplet" question. Arithmetic for the new
    # ceiling, all in MB against the current host's 7942MB total RAM, no swap:
    #   server 3072 + postgres 1536 + adminer 64 + redis 160 = 4832
    #   7942 - 4832 = 3110MB headroom for the OS and page cache, no swap.
    #   Re-derive by re-summing the mem_limit lines below against `free -m`
    #   on the host if any service's limit changes.
    # Do NOT run `docker compose exec server flask ...` against production —
    # it boots a second full Flask app (~800MB) inside THIS SAME cgroup, on
    # top of gunicorn's steady-state footprint, and is what actually killed
    # gunicorn: 07 Aug 12:22 and 17 Aug 09:29 from ordinary operation, and
    # 18 Aug from a one-off diagnostic `flask` invocation. Query Postgres
    # directly instead (`flask --app manage db-query` from OUTSIDE the
    # container, or `docker compose exec postgres psql`) — never spin up a
    # second app instance inside the server container's memory budget.
    mem_limit: 3072m
    memswap_limit: 3072m   # == mem_limit: no swap allowance
    ports:
      # NOT 0.0.0.0. Publishing on all interfaces left the app reachable from the
      # open internet on :5000, bypassing Caddy entirely - no TLS, no request
      # timeouts, none of the security headers (verified 2026-07-30: arbitrary
      # scanner IPs held established connections straight to gunicorn).
      #   127.0.0.1  - host-side healthcheck and the archie-watchdog timer
      #   10.106.0.6 - this droplet's DigitalOcean VPC address, which is where
      #                the Caddy droplet (10.106.0.2) now proxies to. If the
      #                droplet's private IP ever changes, update both this and
      #                the proxy's Caddyfile.
      - '127.0.0.1:5000:5000'
      - '10.106.0.6:5000:5000'
    volumes:
      - './:/app'
    environment:
      # Database URLs - separate databases for dev and test
      DATABASE_URL: postgresql://archie_runtime:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/archie
      DEV_DATABASE_URL: postgresql://archie_runtime:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/archie
      TEST_DATABASE_URL: postgresql://archie_runtime:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/archie_test
      TRANSFORMATION_COMMAND_CAPABILITY_SECRET: ${TRANSFORMATION_COMMAND_CAPABILITY_SECRET}
      TRANSFORMATION_COMMAND_CAPABILITY_PREVIOUS_SECRETS: ${TRANSFORMATION_COMMAND_CAPABILITY_PREVIOUS_SECRETS:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ORG_ENCRYPTION_MASTER_KEY: ${ORG_ENCRYPTION_MASTER_KEY:-}
      # The platform's own AI provider settings. Unset stays empty, so the code's defaults apply.
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
