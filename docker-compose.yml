      LLM_PRICE_PER_MTOK_IN_OPENROUTER: ${LLM_PRICE_PER_MTOK_IN_OPENROUTER:-}
      LLM_PRICE_PER_MTOK_IN_HUGGINGFACE: ${LLM_PRICE_PER_MTOK_IN_HUGGINGFACE:-}
