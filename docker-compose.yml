      LLM_PRICE_PER_MTOK_OUT_ANTHROPIC: ${LLM_PRICE_PER_MTOK_OUT_ANTHROPIC:-}
      LLM_PRICE_PER_MTOK_OUT_AZURE: ${LLM_PRICE_PER_MTOK_OUT_AZURE:-}
      LLM_PRICE_PER_MTOK_OUT_OPENROUTER: ${LLM_PRICE_PER_MTOK_OUT_OPENROUTER:-}
      LLM_PRICE_PER_MTOK_OUT_HUGGINGFACE: ${LLM_PRICE_PER_MTOK_OUT_HUGGINGFACE:-}
      REDISTOGO_URL: redis://redis:6379
      GUNICORN_WORKERS: "3"
      # Was 4x8 (measured on this 2 vCPU box at concurrency 32: 4 workers gave
      # 89 req/s p95 628ms vs 2 workers 51 req/s p95 1588ms; each extra worker
      # costs ~355 MB). Dropped to 3 after ARCH-001: `dmesg -T` on the droplet
      # shows the memory-cgroup OOM killer taking gunicorn twice under normal
      # single-user testing (07 Aug 12:22, 17 Aug 09:29) despite the 2600m
      # mem_limit then in force and `free -m` showing only ~178MB free on this
      # 4GB host once postgres/redis/adminer are also running. Killing the
      # gunicorn process kills the container's PID 1, so `restart:
      # unless-stopped` has to replay the whole init-db -> reconcile-schema ->
      # backfills -> gunicorn boot chain (8-12 min) before anything answers
      # again — that chain, not request handling, is the outage users saw.
      # KEPT deliberately when mem_limit was raised to 3072m on 18 Aug: the
      # trim and the ceiling raise are two different fixes for two different
      # symptoms. The trim protects steady-state headroom against ordinary
      # traffic; the raised ceiling protects against the actual root cause
      # found on inspection — `docker compose exec server flask ...` booting
      # a second ~800MB app inside this cgroup (see the mem_limit comment
      # above). Reverting the trim now would spend the new headroom on more
      # workers instead of on that margin. If OOMs recur at 3072m/3 workers
      # WITHOUT a `flask exec` in the picture, that is new evidence and a
      # hardware question — not before.
      GUNICORN_THREADS: "8"
      GUNICORN_MAX_REQUESTS: "750"
      # 8+4 per process x 3 workers = 36 connections, under max_connections=100.
      SQLALCHEMY_POOL_SIZE: "8"
      SQLALCHEMY_MAX_OVERFLOW: "4"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 10 http://127.0.0.1:5000/health || exit 1"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 420s
    depends_on:
      database-acl:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    # Disabled 2026-07-30. Its only job is sending email, but no MAIL_/SMTP
    # settings exist anywhere, so it could not send - it only logged messages,
    # while holding ~1 GB (25% of RAM). Parked behind a profile, not deleted:
    #   re-enable with:  docker compose --profile email up -d worker
    profiles: ['email']
    build:
      dockerfile: Dockerfile.worker
      context: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1200m
    memswap_limit: 1200m   # == mem_limit: no swap allowance
    volumes:
      - './:/app'
    environment:
      # Database URLs - separate databases for dev and test
      DATABASE_URL: postgresql://archie_runtime:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/archie
      DEV_DATABASE_URL: postgresql://archie_runtime:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/archie
      TEST_DATABASE_URL: postgresql://archie_runtime:${DATABASE_RUNTIME_PASSWORD}@postgres:5432/archie_test
      TRANSFORMATION_COMMAND_CAPABILITY_SECRET: ${TRANSFORMATION_COMMAND_CAPABILITY_SECRET}
      TRANSFORMATION_COMMAND_CAPABILITY_PREVIOUS_SECRETS: ${TRANSFORMATION_COMMAND_CAPABILITY_PREVIOUS_SECRETS:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      ORG_ENCRYPTION_MASTER_KEY: ${ORG_ENCRYPTION_MASTER_KEY:-}
      REDISTOGO_URL: redis://redis:6379
      # The RQ worker opens its own pool too; it only sends email, so keep it small.
      SQLALCHEMY_POOL_SIZE: "4"
      SQLALCHEMY_MAX_OVERFLOW: "2"
    depends_on:
      database-acl:
        condition: service_completed_successfully
      redis:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 1536m
    memswap_limit: 1536m   # == mem_limit: no swap allowance
    environment:
      POSTGRES_USER: postgres
      # Sourced from .env, which is gitignored. It must NOT be hardcoded here:
      # docker-compose.yml is tracked and this repository is published.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      # Init script creates flask_dev and flask_test databases on startup
      - ./scripts/database/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      # Bind to loopback only — the app reaches Postgres over the internal Docker
      # network (host 'postgres'), so this never needs to be public. Publishing on
      # 0.0.0.0 exposed the DB to the internet (Shadowserver/DO security finding).
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 64m
    memswap_limit: 64m   # == mem_limit: no swap allowance
    ports:
      # Adminer is a DB admin UI — loopback only (reach it via an SSH tunnel), never public.
      - '127.0.0.1:8080:8080'
    depends_on:
      - postgres

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    mem_limit: 160m
    memswap_limit: 160m   # == mem_limit: no swap allowance
    # noeviction is deliberate: Redis is the RQ broker, so evicting keys would
    # silently drop queued jobs. maxmemory is a guard rail, not a cache policy.
    # Do NOT add --save here: any --save argument overrides the compiled-in
    # defaults and yielded an EMPTY save policy (verified), silently disabling
    # RDB snapshots. Omitting it keeps the default 3600/1, 300/100, 60/10000.
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      # Loopback only — the app uses Redis over the Docker network (host 'redis').
      # Publishing on 0.0.0.0 left Redis open to the internet on 6379 (the security finding).
      - '127.0.0.1:6379:6379'

volumes:
  db-data:
