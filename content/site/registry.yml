       blurb: "See what a failure would reach and record the risks tied to it."}
    - {label: Transformation planning, icon: target, href: /use-cases/target-state-roadmap,
       own_page: /solutions/transformation-planning,
       blurb: "Plan the path from today's estate to the target and track it as a portfolio."}
    - {label: Enterprise architecture modelling, icon: boxes, href: "/features#architecture-management",
       own_page: /features/architecture,
       blurb: "Model applications, architecture and organisation, and draw from them."}
    - {label: Architecture governance, icon: building-2, href: /use-cases/architecture-review-board,
       own_page: /solutions/architecture-governance,
       blurb: "Review architecture changes, record the decision and its conditions."}
  coming_soon:
    label: Coming soon
    items:
      - {label: Scenarios, icon: git-compare, href: /modules/scenario-modelling,
         blurb: "Coming soon: compare what-if plans side by side before you commit."}
      - {label: Software and tool discovery, icon: search, href: /modules/software-and-tool-discovery,
         blurb: "Coming soon: discover the software and tools you actually pay for and use."}
      - {label: Advisers for every role, icon: users, href: /modules/advisers-for-every-role,
         blurb: "Early access: an adviser per role, answering from your model with citations."}
      - {label: Predictive checks, icon: lightbulb, href: /modules/predictive-checks,
         blurb: "Early access: five checks that flag trouble in your model, with the evidence."}

